# Dashboard "Einkauf" (Speicher-Dashboard)
views:
- icon: mdi:cart
  max_columns: 2
  path: start
  sections:
  - cards:
    - heading: Wo stehst du gerade?
      icon: mdi:map-marker
      type: heading
    - fill_container: true
      grid_options:
        columns: 4
        rows: 2
      icon: mdi:fridge
      icon_color: blue
      layout: vertical
      primary: Kühlschrank
      secondary: 19 Artikel
      tap_action:
        action: navigate
        navigation_path: /einkauf-liste/kuehlschrank
      type: custom:mushroom-template-card
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(56,189,248,0.14); } '
    - fill_container: true
      grid_options:
        columns: 4
        rows: 2
      icon: mdi:cupboard
      icon_color: brown
      layout: vertical
      primary: Vorrat
      secondary: 13 Artikel
      tap_action:
        action: navigate
        navigation_path: /einkauf-liste/vorrat
      type: custom:mushroom-template-card
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(180,120,70,0.14); } '
    - fill_container: true
      grid_options:
        columns: 4
        rows: 2
      icon: mdi:snowflake
      icon_color: cyan
      layout: vertical
      primary: Tiefkühler
      secondary: 8 Artikel
      tap_action:
        action: navigate
        navigation_path: /einkauf-liste/tiefkuehler
      type: custom:mushroom-template-card
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(34,211,238,0.14); } '
    - fill_container: true
      grid_options:
        columns: 4
        rows: 2
      icon: mdi:bread-slice
      icon_color: orange
      layout: vertical
      primary: Küche
      secondary: Brot & Obst
      tap_action:
        action: navigate
        navigation_path: /einkauf-liste/kueche
      type: custom:mushroom-template-card
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(251,146,60,0.14); } '
    - fill_container: true
      grid_options:
        columns: 4
        rows: 2
      icon: mdi:shower
      icon_color: purple
      layout: vertical
      primary: Drogerie
      secondary: Bad & Putzen
      tap_action:
        action: navigate
        navigation_path: /einkauf-liste/drogerie
      type: custom:mushroom-template-card
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(167,139,250,0.14); } '
    - fill_container: true
      grid_options:
        columns: 4
        rows: 2
      icon: mdi:broom
      icon_color: grey
      layout: vertical
      primary: Erledigtes aufräumen
      tap_action:
        action: perform-action
        confirmation:
          text: Abgehakte Einträge entfernen?
        perform_action: todo.remove_completed_items
        target:
          entity_id: todo.einkaufsliste
      type: custom:mushroom-template-card
      card_mod:
        style: 'ha-card { overflow: hidden; background: var(--card-background-color); } '
    type: grid
  - cards:
    - badges:
      - entity: todo.einkaufsliste
        show_name: false
        show_state: true
        type: entity
      heading: Auf der Liste
      icon: mdi:format-list-checks
      type: heading
    - entity: todo.einkaufsliste
      grid_options:
        columns: full
      type: todo-list
      card_mod:
        style: 'ha-card { overflow: hidden;  }'
    type: grid
  title: Einkauf
  type: sections
  theme: Frame Haus
- back_path: /einkauf-liste/start
