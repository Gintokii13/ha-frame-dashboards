- title: Räume
  path: raeume
  icon: mdi:thermostat
  type: sections
  max_columns: 3
  theme: Frame Haus
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Erdgeschoss
      icon: mdi:home-floor-0
      heading_style: title
    - type: tile
      entity: climate.vtherm_wohnzimmer
      name: Wohnzimmer
      grid_options:
        columns: 6
      features:
      - type: target-temperature
      - type: climate-hvac-modes
        hvac_modes:
        - auto
        - heat
        - 'off'
        style: icons
      - type: climate-preset-modes
        preset_modes:
        - comfort
        - eco
        - boost
        style: dropdown
      features_position: bottom
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''climate.vtherm_wohnzimmer'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'',''docked'']
