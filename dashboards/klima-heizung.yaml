# Dashboard "Klima & Heizung" (Speicher-Dashboard)
views:
- title: Anlage
  path: anlage
  icon: mdi:heat-pump
  type: sections
  max_columns: 4
  theme: Frame Haus
  badges:
  - type: entity
    entity: sensor.aussentemperatur
    name: Außen
    show_name: true
    color: cyan
  - type: entity
    entity: sensor.wp_cop_aktuell
    name: COP
    show_name: true
    color: green
  - type: entity
    entity: sensor.heizstab_leistung
    name: Heizstab
    show_name: true
    color: amber
  - type: entity
    entity: sensor.digin_stoerungen
    name: Störungen
    show_name: true
    color: red
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Wärmepumpe
      icon: mdi:heat-pump
      heading_style: title
    - type: tile
      entity: sensor.warmepumpenleistung
      name: Thermische Leistung
      grid_options:
        columns: 6
      card_mod:
        style: 'ha-card { overflow: hidden; {% if states(''sensor.warmepumpenleistung'') in [''unavailable'',''unknown''] %} opacity: .45; {% else %} background: var(--card-background-color); {% endif %}
          } '
    - type: tile
      entity: sensor.wp_leistungsaufnahme
      name: Elektrische Leistung
      grid_options:
        columns: 6
      card_mod:
        style: 'ha-card { overflow: hidden; {% if states(''sensor.wp_leistungsaufnahme'') in [''unavailable'',''unknown''] %} opacity: .45; {% else %} background: var(--card-background-color); {% endif
          %} } '
    - type: tile
      entity: sensor.wp_cop_aktuell
      name: COP aktuell
      grid_options:
        columns: 6
      card_mod:
        style: 'ha-card { overflow: hidden; {% if states(''sensor.wp_cop_aktuell'') in [''unavailable'',''unknown''] %} opacity: .45; {% else %} background: var(--card-background-color); {% endif %} } '
    - type: tile
      entity: sensor.aussentemperatur
      name: Außen
      grid_options:
        columns: 6
      card_mod:
        style: 'ha-card { overflow: hidden; {% if states(''sensor.aussentemperatur'') in [''unavailable'',''unknown''] %} opacity: .45; {% else %} background: var(--card-background-color); {% endif %} } '
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Temperaturen
      icon: mdi:thermometer-lines
      heading_style: title
    - type: tile
      entity: sensor.warmwasserpuffer
      name: Warmwasserpuffer
      grid_options:
        columns: 6
      card_mod:
        style: 'ha-card { overflow: hidden; {% if states(''sensor.warmwasserpuffer'') in [''unavailable'',''unknown''] %} opacity: .45; {% else %} background: var(--card-background-color); {% endif %} } '
    - type: tile
      entity: sensor.warmwassertemperatur
      name: Warmwasser
      grid_options:
        columns: 6
      card_mod:
        style: 'ha-card { overflow: hidden; {% if states(''sensor.warmwassertemperatur'') in [''unavailable'',''unknown''] %} opacity: .45; {% else %} background: var(--card-background-color); {% endif
          %} } '
    - type: tile
