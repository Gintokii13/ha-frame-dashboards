  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Leistung & COP – 24 h
      icon: mdi:chart-line
      heading_style: title
    - type: history-graph
      title: Wärmepumpe
      hours_to_show: 24
      entities:
      - entity: sensor.warmepumpenleistung
        name: Thermisch
      - entity: sensor.wp_leistungsaufnahme
