    template: frame
  frame_energy:
    custom_fields:
      body: |-
        [[[
        const fx = variables.fx; if (!fx) return '';
        const esc = fx.esc, part = variables.part;
        const P = (id) => { const s = states[id]; const n = s ? parseFloat(s.state) : NaN; return isNaN(n) ? null : n; };
        const nf = (x, d) => x == null ? '–' : x.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
        const W = (v) => v == null ? '–' : Math.abs(v) >= 1000 ? nf(v / 1000, 1) + '<small>kW</small>' : nf(Math.round(v), 0) + '<small>W</small>';
        const Wt = (v) => v == null ? '–' : Math.abs(v) >= 1000 ? nf(v / 1000, 1) + ' kW' : Math.round(v) + ' W';
        const K = (v, d) => v == null ? '–' : nf(v, d == null ? 1 : d) + ' kWh';
        const pct = (v) => v == null ? '–' : Math.round(v * 100) + ' %';
        const clamp = (v) => v == null ? null : Math.max(0, Math.min(1, v));
        const tap = (id) => ` data-id="${id}" onpointerup="__frameInfo(this)"`;
        const inv = P('sensor.wechselrichter_wirkleistung'), grid = P('sensor.stromzahler_wirkleistung');
        const house = inv != null && grid != null ? Math.max(0, inv - grid) : P('sensor.hausverbrauch');
        if (part === 'now') {
          const pv = P('sensor.wechselrichter_eingangsleistung'), bat = P('sensor.batterien_lade_entladeleistung'), soc = P('sensor.batterien_batterieladung');
          const fcNow = P('sensor.power_production_now');
          const pvSub = pv != null && pv > 20 ? (fcNow != null ? 'erwartet ' + Wt(fcNow) : 'Sonne liefert') : 'keine Erzeugung';
          const fromGrid = grid != null && grid < -20 ? -grid : 0;
          const houseSub = house == null ? '' : house < 20 ? 'kaum Verbrauch' : fromGrid ? Math.round(fromGrid / Math.max(house, 1) * 100) + ' % aus dem Netz' : 'komplett selbst versorgt';
          const gState = grid == null ? '' : grid < -20 ? 'is-imp' : grid > 20 ? 'is-exp' : '';
          const gLab = grid == null ? 'Netz' : grid < -20 ? 'Netzbezug' : grid > 20 ? 'Einspeisung' : 'Netz';
          const gSub = grid == null ? '' : grid < -20 ? 'kaufst du gerade' : grid > 20 ? 'verschenkst du gerade' : 'ausgeglichen';
          const bSub = bat == null ? '' : bat > 20 ? 'lädt mit ' + Wt(bat) : bat < -20 ? 'liefert ' + Wt(-bat) : 'ruht';
          const blk = (cls, lab, val, sub, id, extra) => `<div class="en-b ${cls}"${tap(id)}><span class="en-l">${lab}</span><b class="num en-v">${val}</b><span class="en-s">${sub}</span>${extra || ''}</div>`;
          return `<div class="en-now">`
            + blk('is-sun' + (pv > 20 ? ' is-on' : ''), 'Sonne', W(pv), pvSub, 'sensor.wechselrichter_eingangsleistung')
            + blk('is-house', 'Haus', W(house), houseSub, 'sensor.stromzahler_wirkleistung')
            + blk('is-grid ' + gState, gLab, W(grid == null ? null : Math.abs(grid)), gSub, 'sensor.stromzahler_wirkleistung')
            + blk('is-bat', 'Akku', soc == null ? '–' : nf(soc, 0) + '<small>%</small>', bSub, 'sensor.batterien_batterieladung', `<i class="en-bar"><i style="width:${soc == null ? 0 : Math.max(0, Math.min(100, soc))}%"></i></i>`)
            + `</div>`;
        }
        if (part === 'today') {
          const mid = new Date(); mid.setHours(0, 0, 0, 0);
          const hrs = Math.ceil((Date.now() - mid.getTime()) / 3600000) + 1;
          const ids = ['sensor.stromzahler_verbrauch', 'sensor.stromzahler_exportierte_energie'];
          const H = fx.hist(ids, hrs, 5, '5minute', ['change']);
          const sum = (id) => { const rows = H[id]; if (!rows) return null; return rows.filter((r) => (typeof r.start === 'number' ? r.start : Date.parse(r.start)) >= mid.getTime()).reduce((a, r) => a + (r.change || 0), 0); };
          const imp = sum(ids[0]), exp = sum(ids[1]);
          const pvT = P('sensor.wechselrichter_tagesertrag'), bc = P('sensor.batterien_tagesladung'), bd = P('sensor.batterien_tagesentladung');
          const fc = P('sensor.energy_production_today'), fcTom = P('sensor.energy_production_tomorrow');
          const ok = [pvT, imp, exp, bc, bd].every((x) => x != null);
          const cons = ok ? Math.max(0, pvT + imp - exp - bc + bd) : null;
          const aut = cons ? clamp(1 - imp / cons) : null;
          const eig = ok && pvT > 0.05 ? clamp((pvT - exp) / pvT) : null;
          const pvShare = fc ? clamp(pvT / fc) : null;
          const tom = fcTom == null ? '' : fc && fcTom > fc * 1.3 ? 'mehr Sonne als heute' : fc && fcTom < fc * 0.7 ? 'weniger Sonne als heute' : 'ähnlich wie heute';
          const row = (lab, val, id) => `<div class="en-r"${id ? tap(id) : ''}><span>${lab}</span><b>${val}</b></div>`;
          return `<div class="en-today">`
            + `<div class="en-hero"><div><span class="en-l">Autarkie heute</span><b class="num en-big">${aut == null ? '–' : Math.round(aut * 100)}<small>%</small></b></div>`
            + `<div class="en-hero-r"><span class="en-l">Verbrauch heute</span><b class="num en-mid">${cons == null ? '–' : nf(cons, 1)}<small>kWh</small></b></div></div>`
            + `<i class="en-bar en-bar--aut"><i style="width:${aut == null ? 0 : Math.round(aut * 100)}%"></i></i>`
            + `<div class="en-rows">`
            + row('Sonnenertrag', K(pvT) + (fc != null ? ` <em>von ${nf(fc, 1)} erwartet</em>` : ''), 'sensor.wechselrichter_tagesertrag')
            + (pvShare != null ? `<i class="en-bar en-bar--pv"><i style="width:${Math.round(pvShare * 100)}%"></i></i>` : '')
            + row('Netzbezug', K(imp), 'sensor.stromzahler_verbrauch')
            + row('Einspeisung', K(exp), 'sensor.stromzahler_exportierte_energie')
            + row('Eigenverbrauch', pct(eig))
            + row('Akku', 'rein ' + K(bc) + ' · raus ' + K(bd), 'sensor.batterien_tagesladung')
            + `</div>`
            + (fcTom != null ? `<div class="en-tom"${tap('sensor.energy_production_tomorrow')}><ha-icon icon="mdi:weather-partly-cloudy"></ha-icon><span>Morgen <b>${nf(fcTom, 1)} kWh</b> erwartet · ${tom}</span></div>` : '')
            + `</div>`;
        }
        if (part === 'loads') {
          const L = variables.loads || [];
          const items = L.map((l) => { const v = l.ids.map(P).filter((x) => x != null); return { n: l.n, icon: l.icon, id: l.ids[0], v: v.length ? v.reduce((a, b) => a + b, 0) : null }; })
            .filter((x) => x.v != null && x.v >= 5).sort((a, b) => b.v - a.v);
          const known = items.reduce((a, x) => a + x.v, 0);
          if (house != null && house - known > 20) items.push({ n: 'Rest / nicht gemessen', icon: 'mdi:dots-horizontal', v: house - known, rest: true });
          const max = Math.max(house || 0, ...items.map((x) => x.v), 1);
          const ww = states['switch.warmwasser_nachheizen'], wwOn = ww && ww.state === 'on';
          return `<div class="en-loads"><div class="en-lh"><span class="en-l">Wer gerade Strom braucht</span><b class="num">${Wt(house)}</b></div>`
            + `<div class="en-list">` + items.slice(0, 9).map((x) => `<div class="en-ld${x.rest ? ' is-rest' : ''}"${x.rest ? '' : tap(x.id)}><ha-icon icon="${x.icon}"></ha-icon><span class="en-ln">${esc(x.n)}</span><b>${Wt(x.v)}</b><i class="en-lb"><i style="width:${Math.max(2, Math.round(x.v / max * 100))}%"></i></i></div>`).join('')
            + (items.length ? '' : '<div class="en-quiet">Gerade läuft nichts Großes.</div>') + `</div>`
            + (ww ? `<button type="button" class="en-ww${wwOn ? ' is-on' : ''}" onpointerup="__frameCall('switch','toggle',{entity_id:'switch.warmwasser_nachheizen'})"><ha-icon icon="mdi:water-boiler"></ha-icon><span>Warmwasser nachheizen</span><b>${wwOn ? 'an' : 'aus'}</b></button>` : '')
            + `</div>`;
        }
        if (part === 'devices') {
          const back = window.__frameEnDay ? 1 : 0;
          const prefs = fx.cached('__frameEnPrefs', 'prefs', 30, () => hass.callWS({ type: 'energy/get_prefs' }));
          const shell = (inner) => `<div class="en-dev">${inner}</div>`;
          if (!prefs) return shell('<div class="en-quiet">Lade Energiedaten …</div>');
          const S = { gin: [], gout: [], pv: [], bin: [], bout: [] };
          (prefs.energy_sources || []).forEach((s) => {
            if (s.type === 'grid') {
              if (s.stat_energy_from) S.gin.push(s.stat_energy_from);
              if (s.stat_energy_to) S.gout.push(s.stat_energy_to);
              (s.flow_from || []).forEach((f) => f.stat_energy_from && S.gin.push(f.stat_energy_from));
              (s.flow_to || []).forEach((f) => f.stat_energy_to && S.gout.push(f.stat_energy_to));
            } else if (s.type === 'solar' && s.stat_energy_from) S.pv.push(s.stat_energy_from);
            else if (s.type === 'battery') { if (s.stat_energy_from) S.bout.push(s.stat_energy_from); if (s.stat_energy_to) S.bin.push(s.stat_energy_to); }
          });
          const devs = (prefs.device_consumption || []).filter((d) => d.stat_consumption && !d.included_in_stat);
          const ids = [...new Set([].concat(S.gin, S.gout, S.pv, S.bin, S.bout, devs.map((d) => d.stat_consumption)))];
          const d0 = new Date(); d0.setHours(0, 0, 0, 0); d0.setDate(d0.getDate() - back);
          const t0 = d0.getTime(), d1 = new Date(d0); d1.setDate(d1.getDate() + 1); const t1 = d1.getTime();
          const hrs = Math.ceil((Date.now() - t0) / 3600000) + 1;
          const H = fx.hist(ids, hrs, back ? 30 : 5, '5minute', ['change']);
          if (!ids.some((id) => H[id])) return shell('<div class="en-quiet">Lade Energiedaten …</div>');
          const per = (id) => { const o = new Array(24).fill(0); (H[id] || []).forEach((r) => { const t = typeof r.start === 'number' ? r.start : Date.parse(r.start); if (t >= t0 && t < t1 && r.change != null) o[new Date(t).getHours()] += r.change; }); return o; };
          const add = (list) => { const o = new Array(24).fill(0); list.forEach((id) => per(id).forEach((v, i) => { o[i] += v; })); return o; };
          const gin = add(S.gin), gout = add(S.gout), pv = add(S.pv), bin = add(S.bin), bout = add(S.bout);
          const cons = gin.map((v, i) => Math.max(0, v + pv[i] + bout[i] - gout[i] - bin[i]));
          const D = devs.map((d) => { const a = per(d.stat_consumption); return { n: d.name || fx.nameOf(d.stat_consumption), id: d.stat_consumption, a, v: a.reduce((x, y) => x + y, 0) }; });
          const meas = new Array(24).fill(0); D.forEach((d) => d.a.forEach((v, i) => { meas[i] += v; }));
          const un = cons.map((c, i) => Math.max(0, c - meas[i]));
          const sum = (a) => a.reduce((x, y) => x + y, 0);
          const total = sum(cons), unT = sum(un), share = total > 0 ? unT / total : 0;
          const nf = (x, d) => x.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
          const K = (v) => (v >= 10 ? nf(v, 1) : nf(v, 2)) + ' kWh';
          const pad = (n) => String(n).padStart(2, '0');
          const nowH = back ? 23 : new Date().getHours();
          const top = Math.max(...cons, 0.1);
          const cols = cons.map((c, i) => {
            if (i > nowH) return '<span class="en-col is-fut"><i class="f"></i></span>';
            const m = Math.max(0, c - un[i]);
            return `<span class="en-col${!back && i === nowH ? ' is-now' : ''}"><i class="m" style="height:${(m / top * 100).toFixed(1)}%"></i><i class="u" style="height:${(un[i] / top * 100).toFixed(1)}%"></i></span>`;
          }).join('');
          const tips = cons.slice(0, nowH + 1).map((c, i) => ({ i, x: (i + 0.5) / 24 * 100,
            h: `${pad(i)}–${pad(i + 1)} Uhr · <b>${K(c)}</b>${un[i] >= 0.01 ? ` · nicht erfasst ${K(un[i])}` : ''}` }));
          const peak = un.reduce((b, v, i) => (v > un[b] ? i : b), 0);
          const note = unT >= 0.5 && un[peak] >= 0.5 ? `<div class="en-note">Meiste Lücke ${pad(peak)}–${pad(peak + 1)} Uhr: ${K(un[peak])} ohne Zuordnung</div>` : '';
          const list = D.filter((d) => d.v >= 0.005).sort((a, b) => b.v - a.v);
          const shown = list.slice(0, 8), rest = list.slice(8);
          const max = Math.max(unT, ...shown.map((d) => d.v), 0.01);
          const row = (n, v, cls, id) => `<div class="en-dv${cls}"${id ? ` data-id="${id}" onpointerup="__frameInfo(this)"` : ''}><span class="en-ln">${fx.esc(n)}</span><b>${K(v)}</b><i class="en-lb"><i style="width:${Math.max(2, Math.round(v / max * 100))}%"></i></i></div>`;
          const rows = [{ n: 'Nicht erfasst', v: unT, un: true }].concat(shown).sort((a, b) => b.v - a.v)
            .map((d) => (d.un ? row(d.n, d.v, ' is-un') : row(d.n, d.v, '', d.id))).join('')
            + (rest.length ? `<div class="en-more">+ ${rest.length} weitere · ${K(sum(rest.map((d) => d.v)))}</div>` : '');
          const toggle = `<button type="button" class="en-day" onpointerup="window.__frameEnDay=${back ? 0 : 1};this.getRootNode().host.requestUpdate('_config')">${back ? '← Heute' : 'Gestern →'}</button>`;
          return shell(`<div class="en-dev-l">
            <div class="en-dh"><div><span class="en-l">Verbrauch ${back ? 'gestern' : 'heute'} ${toggle}</span><b class="num en-mid">${nf(total, 1)}<small>kWh</small></b></div>
            <div class="en-un"><span class="en-l">Nicht erfasst</span><b class="num en-mid">${nf(unT, 1)}<small>kWh · ${Math.round(share * 100)} %</small></b></div></div>
            <div class="en-chart ch-plot"${fx.tipPlot(tips)}><div class="bars">${cols}</div><div class="en-ax"><span>0</span><span>6</span><span>12</span><span>18</span></div>${fx.TIP}</div>
            <div class="en-leg"><span><i class="m"></i>Geräte gemessen</span><span><i class="u"></i>nicht erfasst</span></div>${note}
          </div><div class="en-dev-r"><span class="en-l">Nach Geräten</span><div class="en-list">${rows}</div></div>`);
        }
        return '';
        ]]]
    extra_styles: |
      .num { font-stretch: 62%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
      .num small { font-size: .42em; margin-left: 3px; font-stretch: 80%; letter-spacing: 0; }
