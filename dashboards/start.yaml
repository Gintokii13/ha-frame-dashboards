      .en-list { display: flex; flex-direction: column; gap: 10px; }
      .en-ld { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; grid-template-rows: auto 4px; column-gap: 10px; row-gap: 5px; align-items: center; cursor: pointer; pointer-events: auto; }
