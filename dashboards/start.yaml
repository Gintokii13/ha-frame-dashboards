          const main = () => { const ha = document.querySelector('home-assistant'); return ha && ha.shadowRoot && ha.shadowRoot.querySelector('home-assistant-main'); };
          const fire = (el, type, detail) => el.dispatchEvent(new CustomEvent(type, { detail, bubbles: true, composed: true }));
          const hide = () => { const m = main(); if (m && m.hass && m.hass.dockedSidebar !== 'always_hidden') fire(m, 'hass-dock-sidebar', { dock: 'always_hidden' }); return m; };
          window.__frameMenu = () => { const m = hide(); if (m) setTimeout(() => fire(m, 'hass-toggle-menu', { open: true }), 80); };
          setTimeout(hide, 300);
        }
        const menu = ipad ? `<button type="button" class="nav nav--menu" onpointerup="__frameMenu()"><ha-icon icon="mdi:menu"></ha-icon><span>Menü</span></button>` : '';
        return `<nav class="rail">${menu}${pages.map((p) => btn(p, false)).join('')}${more}</nav>`;
        ]]]
