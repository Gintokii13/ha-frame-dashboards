      }
  frame_room_heading:
    custom_fields:
      body: |-
        [[[
        const fx = variables.fx; if (!fx) return '';
        const parts = [];
        variables.climates.forEach((id) => {
          const s = states[id]; if (!s || ['unavailable','unknown'].includes(s.state)) return;
          const a = s.attributes;
          if (a.current_temperature != null) parts.push(`<span><b class="num">${fx.nf(a.current_temperature, 1)}°</b></span>`);
          if (a.temperature != null && s.state !== 'off') parts.push(`<span>Soll ${fx.nf(a.temperature, 1)}°</span>`);
          if (a.current_humidity != null) parts.push(`<span>${fx.nf(a.current_humidity, 0)} %</span>`);
          if (a.hvac_action === 'heating') parts.push('<span class="is-heat">heizt</span>');
        });
        const ls = variables.lights.map((id) => states[id]).filter(Boolean);
        if (ls.length) { const on = ls.filter((s) => s.state === 'on').length; parts.push(`<span>${on ? on + ' von ' + ls.length + ' Lichtern an' : 'Licht aus'}</span>`); }
        return `<div class="rh"><div class="sec"><b>${fx.esc(variables.title)}</b></div>${parts.length ? `<div class="rh-sum">${parts.join('')}</div>` : ''}</div>`;
        ]]]
    template: frame
    update_timer: 60s
    variables:
      climates: []
      lights: []
      title: ''
    extra_styles: |-
      .num { font-stretch: 62%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
      .sec { display: flex; align-items: baseline; gap: 10px; border-bottom: 3px solid var(--ink); padding: 2px 0 8px; box-sizing: content-box; height: 20px; }
      .sec b { font-size: 18px; font-weight: 800; font-stretch: 80%; letter-spacing: .09em; text-transform: uppercase; }
      .sec span { font-family: var(--serif); font-size: 21px; line-height: 20px; color: var(--mute); }
      .st .num { font-size: 44px; line-height: .9; white-space: nowrap; }
      .st .num small { font-size: 18px; margin-left: 3px; font-stretch: 80%; }
      .st.is-warn .num { color: var(--alert); }
      .room.is-heat { box-shadow: inset 0 0 0 2px var(--warm-2); }
      .st.is-na .num { color: var(--mute); }
      .rh { display: flex; flex-direction: column; gap: 6px; }
      .rh-sum { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; font-size: 14px; color: var(--ink-2); }
      .rh-sum .num { font-size: 28px; color: var(--ink); }
      .rh-sum .is-heat { color: var(--warm-2); font-weight: 800; }
      .st .num { font-size: 38px; }
  frame_room:
    custom_fields:
      body: |-
        [[[
        const fx = variables.fx; if (!fx) return '';
        const esc = fx.esc;
        const W = window;
        W.__frameTemp = W.__frameTemp || ((id, dir, btn) => {
          const h = W.__frameHass; const st = h && h.states[id]; if (!st) return;
          const a = st.attributes, P = W.__framePend || (W.__framePend = {}), now = Date.now();
          const step = a.target_temp_step || 0.5;
          let cur = P[id] && now - P[id].t < 4000 ? P[id].v : parseFloat(a.temperature);
          if (isNaN(cur)) return;
          let v = Math.round((cur + dir * step) / step) * step;
          if (a.min_temp != null) v = Math.max(a.min_temp, v);
          if (a.max_temp != null) v = Math.min(a.max_temp, v);
          P[id] = { v, t: now };
          const el = btn && btn.parentElement && btn.parentElement.querySelector('.rm-set');
          if (el) el.textContent = v.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '°';
          W.__frameCall('climate', 'set_temperature', { entity_id: id, temperature: v });
        });
        const nf = (x, d) => { const n = parseFloat(x); return isNaN(n) ? '–' : n.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }); };
        const NA = (s) => !s || s.state === 'unavailable' || s.state === 'unknown';
        const call = (d, s, id) => `__frameCall('${d}','${s}',{entity_id:${JSON.stringify(id).replace(/"/g, "'")}})`;
        const ico = (i) => `<ha-icon icon="${i}"></ha-icon>`;
        const C = variables.climates || [], L = variables.lights || [], R = variables.covers || [];
        const c0 = C.length ? states[C[0].e] : null;
        const curT = c0 && !NA(c0) ? nf(c0.attributes.current_temperature, 1) + '°' : '';
        let h = `<div class="rm-head"${C.length ? ` data-id="${C[0].e}" onpointerup="__frameInfo(this)"` : ''}><b>${esc(variables.title)}</b><span class="num">${curT}</span></div>`;
        if (C.length) {
          h += '<div class="rm-sec rm-clim">' + C.map((c) => {
            const s = states[c.e];
            if (NA(s)) return `<div class="rm-cl is-na"><div class="rm-cl-t"><b>${esc(c.n || 'Heizung')}</b><span>nicht verfügbar</span></div></div>`;
            const a = s.attributes, heat = a.hvac_action === 'heating', off = s.state === 'off';
            const shut = !off && !heat && parseFloat(a.current_temperature) < parseFloat(a.temperature) - 0.3;
            const sub = a.current_temperature == null ? 'Raumfühler offline' : C.length > 1 ? 'Ist ' + nf(a.current_temperature, 1) + '°' + (off ? ' · aus' : heat ? ' · heizt' : shut ? ' · Ventil zu' : '') : (off ? 'aus' : heat ? 'heizt' : shut ? 'zu kalt · Ventil zu' : 'Soll erreicht');
            return `<div class="rm-cl${heat ? ' is-heat' : (shut || a.current_temperature == null) ? ' is-shut' : ''}"><div class="rm-cl-t" data-id="${c.e}" onpointerup="__frameInfo(this)"><b>${esc(c.n || 'Heizung')}</b><span>${sub}</span></div>`
              + (off ? '' : `<div class="rm-step"><button type="button" onpointerup="__frameTemp('${c.e}',-1,this)">${ico('mdi:minus')}</button><span class="rm-set num">${nf(a.temperature, 1)}°</span><button type="button" onpointerup="__frameTemp('${c.e}',1,this)">${ico('mdi:plus')}</button></div>`)
              + '</div>';
          }).join('') + '</div>';
        }
        if (L.length) {
          const on = L.filter((l) => states[l.e] && states[l.e].state === 'on');
          h += `<div class="rm-lab"><span>Licht</span>${on.length ? `<button type="button" class="rm-all" onpointerup="${call('light', 'turn_off', on.map((l) => l.e))}">${on.length} an · alle aus</button>` : '<em>alles aus</em>'}</div>`;
          h += '<div class="rm-lights">' + L.map((l) => {
            const s = states[l.e], na = NA(s), isOn = !na && s.state === 'on';
                return `<button type="button" class="rm-lt${isOn ? ' is-on' : ''}${na ? ' is-na' : ''}" onpointerup="${call('light', 'toggle', l.e)}">${ico(isOn ? 'mdi:lightbulb' : 'mdi:lightbulb-outline')}<b>${esc(l.n)}</b></button>`;
          }).join('') + '</div>';
        }
        if (R.length) {
          const ids = R.map((r) => r.e);
          h += `<div class="rm-lab"><span>Rollläden</span>${R.length > 1 ? `<span class="rm-cvall"><em>alle</em><button type="button" onpointerup="${call('cover', 'open_cover', ids)}">${ico('mdi:arrow-up')}</button><button type="button" onpointerup="${call('cover', 'close_cover', ids)}">${ico('mdi:arrow-down')}</button></span>` : ''}</div>`;
          h += '<div class="rm-covers">' + R.map((r) => {
            const s = states[r.e];
            let st = 'nicht verfügbar', pos = null;
            if (!NA(s)) {
              pos = s.attributes.current_position;
              st = s.state === 'opening' ? 'öffnet' : s.state === 'closing' ? 'schließt' : s.state === 'closed' ? 'zu' : pos == null || pos >= 100 ? 'offen' : pos + ' %';
            }
            const fill = pos == null ? (s && s.state === 'closed' ? 0 : 100) : pos;
            return `<div class="rm-cv${NA(s) ? ' is-na' : ''}" style="--pos:${fill}%"><span class="rm-cv-t" data-id="${r.e}" onpointerup="__frameInfo(this)"><b>${esc(r.n)}</b><small>${st}</small></span>`
              + `<button type="button" onpointerup="${call('cover', 'open_cover', r.e)}">${ico('mdi:arrow-up')}</button><button type="button" onpointerup="${call('cover', 'stop_cover', r.e)}">${ico('mdi:stop')}</button><button type="button" onpointerup="${call('cover', 'close_cover', r.e)}">${ico('mdi:arrow-down')}</button></div>`;
          }).join('') + '</div>';
        }
        const M = variables.media || [];
        if (M.length) {
          W.__frameVol = W.__frameVol || ((id, dir) => {
            const h = W.__frameHass; const st = h && h.states[id]; if (!st) return;
            const P = W.__framePend || (W.__framePend = {}), k = id + '#vol', t = Date.now();
            const cur = P[k] && t - P[k].t < 3000 ? P[k].v : (st.attributes.volume_level || 0);
            const v = Math.max(0, Math.min(1, Math.round((cur + dir * 0.05) * 100) / 100));
            P[k] = { v, t };
            W.__frameCall('media_player', 'volume_set', { entity_id: id, volume_level: v });
          });
          h += `<div class="rm-lab"><span>Musik</span></div><div class="rm-media">` + M.map((m) => {
            const s = states[m.e], na = NA(s), a = na ? {} : s.attributes, play = !na && s.state === 'playing';
            const has = !na && (a.media_title || a.media_channel);
            const title = na ? 'nicht verfügbar' : has ? (a.media_title || a.media_channel) : (s.state === 'off' ? 'aus' : 'bereit');
            const sub = na ? m.n : has ? (a.media_artist || a.source || m.n) : (a.source || m.n);
            const vol = !na && a.volume_level != null ? Math.round(a.volume_level * 100) + ' %' : '';
            const art = a.entity_picture ? `<img class="rm-art" src="${esc(a.entity_picture)}" alt="">` : `<span class="rm-art">${ico('mdi:speaker')}</span>`;
            return `<div class="rm-mu${play ? ' is-play' : ''}${na ? ' is-na' : ''}">${art}<span class="rm-mt" data-id="${m.e}" onpointerup="__frameInfo(this)"><b>${esc(title)}</b><small>${esc(sub)}${vol ? ' · ' + vol : ''}</small></span>`
              + (na ? '' : `<button type="button" onpointerup="__frameVol('${m.e}',-1)">${ico('mdi:volume-minus')}</button><button type="button" onpointerup="__frameVol('${m.e}',1)">${ico('mdi:volume-plus')}</button><button type="button" onpointerup="${call('media_player', 'media_play_pause', m.e)}">${ico(play ? 'mdi:pause' : 'mdi:play')}</button>`)
              + '</div>';
          }).join('') + '</div>';
        }
        return h;
        ]]]
