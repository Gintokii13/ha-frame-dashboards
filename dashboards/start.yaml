  frame_openings:
    custom_fields:
      body: |
        [[[
          const fx = variables.fx;
          if (!fx) return '';
          const now = new Date();
          // candidates from the raw states, so the card only observes the contacts themselves
          const raw = (this._hass && this._hass.states) || hass.states;
          const ids = variables.entities.length ? variables.entities
            : Object.keys(raw).filter((id) => id.startsWith('binary_sensor.') && ['door', 'window', 'garage_door'].includes(raw[id].attributes.device_class));
          const contacts = ids.map((id) => states[id]).filter(Boolean);
          const name = (s) => String(s.attributes.friendly_name || s.entity_id);
          const openNow = contacts.filter((s) => s.state === 'on').sort((a, b) => new Date(a.last_changed) - new Date(b.last_changed));
          const hist = fx.changes(contacts.map((s) => s.entity_id), 24, 5);
          const t0 = fx.day0(now).getTime(), opens = [];
          contacts.forEach((s) => fx.runs(hist[s.entity_id], ['off']).forEach((r) => { if (r.from >= t0) opens.push({ name: name(s), from: r.from }); }));
          opens.sort((a, b) => b.from - a.from);
          const n = openNow.length;
          const more = n
            ? fx.more(fx.t('open_since'), openNow.slice(0, 4).map((s) => [name(s), fx.when(new Date(s.last_changed), now)]))
            : fx.more('', [[fx.t('opened_today'), `${opens.length}×`], [fx.t('last_opened'), opens[0] ? `${fx.esc(opens[0].name)} · ${fx.time(new Date(opens[0].from))}` : null]]);
          const tap = ` tap${fx.isOpen('openings')}"${fx.tapAttr('openings')}`;
          const title = fx.esc(variables.title || fx.t('windows_doors'));
          if (!n) {
            return `<div class="blk${tap}><div class="blk-row">
              <span class="blk-ico"><ha-icon icon="mdi:window-closed-variant"></ha-icon></span>
              <span class="blk-main"><span class="label">${title}</span><span class="blk-big">${contacts.length ? fx.t('all_closed_big') : '–'}</span></span>
            </div>${more}</div>`;
          }
          return `<div class="blk blk--warn${tap}><div class="blk-row">
              <span class="blk-ico is-warn"><ha-icon icon="mdi:window-open-variant"></ha-icon></span>
              <span class="blk-main"><span class="label">${title}</span><span class="blk-big">${fx.t('n_open', n)}</span></span>
            </div>
            <div class="chips">${openNow.map((s) => `<span class="chip">${fx.esc(name(s))}<small>${fx.dur(now - new Date(s.last_changed))}</small></span>`).join('')}</div>
            ${more}</div>`;
        ]]]
    template: frame
    update_timer: 60s
    variables:
