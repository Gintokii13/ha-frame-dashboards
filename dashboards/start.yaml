      .sc b { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sc span { font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sc.is-active { background: var(--ink); }
      .sc.is-active b, .sc.is-active ha-icon { color: var(--paper); }
      .sc.is-active span { color: rgb(242 238 230 / .7); }
      .sc { padding: 8px 12px; column-gap: 10px; }
      .sc ha-icon { --mdc-icon-size: 22px; width: 22px; height: 22px; }
