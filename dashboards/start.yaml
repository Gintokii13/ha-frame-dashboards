    template: frame
    update_timer: 60s
  frame_lights:
    custom_fields:
      body: |-
        [[[
        const fx = variables.fx; if (!fx) return '';
        const esc = fx.esc, W = window;
        W.__frameLt = W.__frameLt || {
          down(el, ev) { if (ev.button > 0) return; el.__held = false; clearTimeout(el.__t); el.__t = setTimeout(() => { el.__held = true; el.dispatchEvent(new CustomEvent('hass-more-info', { detail: { entityId: el.dataset.id }, bubbles: true, composed: true })); }, 550); },
          up(el) { clearTimeout(el.__t); if (el.__held) return; const id = el.dataset.id, on = el.classList.toggle('is-on'); W.__frameCall(id.split('.')[0], on ? 'turn_on' : 'turn_off', { entity_id: id }); },
          cancel(el) { clearTimeout(el.__t); el.__held = true; },
        };
        const NA = (s) => !s || ['unavailable', 'unknown'].includes(s.state);
        const L = (variables.lights || []).map((l) => ({ ...l, s: states[l.e] })).filter((l) => !NA(l.s));
        const on = L.filter((l) => l.s.state === 'on'), off = L.filter((l) => l.s.state !== 'on' && !l.auto);
        const show = on.concat(off).slice(0, Math.max(variables.slots || 8, on.length));
        const tile = (l) => {
          const isOn = l.s.state === 'on', br = l.s.attributes.brightness;
          const pct = isOn ? (br != null ? Math.round(br / 2.55) : 100) : 0;
          const sub = (l.r ? l.r + ' · ' : '') + (isOn ? (br != null ? pct + ' %' : 'an') : 'aus');
          return `<button type="button" class="lx${isOn ? ' is-on' : ''}" style="--pct:${pct}%" data-id="${l.e}" onpointerdown="__frameLt.down(this,event)" onpointerup="__frameLt.up(this)" onpointercancel="__frameLt.cancel(this)" oncontextmenu="return false"><ha-icon icon="${isOn ? 'mdi:lightbulb-on' : 'mdi:lightbulb-outline'}"></ha-icon><span><b>${esc(l.n)}</b><small>${esc(sub)}</small></span></button>`;
        };
        const allOff = on.length ? `<button type="button" class="lx-all" onpointerup="__frameCall('homeassistant','turn_off',{entity_id:${JSON.stringify(on.map((l) => l.e)).replace(/"/g, "'")}})">${on.length} an · alle aus</button>` : '<em>alles aus · meist genutzt</em>';
        return `<div class="lx-head"><b>Licht</b>${allOff}</div><div class="lx-grid">${show.map(tile).join('')}</div>`;
        ]]]
    extra_styles: |-
      .lx-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 3px solid var(--ink); padding: 2px 0 8px; margin-bottom: 12px; height: 20px; box-sizing: content-box; }
      .lx-head b { font-size: 18px; font-weight: 800; font-stretch: 80%; letter-spacing: .09em; text-transform: uppercase; }
      .lx-head em { font-style: normal; font-family: var(--serif); font-size: 18px; color: var(--mute); white-space: nowrap; }
      .lx-all { all: unset; box-sizing: border-box; height: 26px; padding: 0 12px; border-radius: 13px; background: var(--ink); color: var(--card); font: 700 13px var(--sans); cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; white-space: nowrap; }
      .lx-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 56px; gap: 8px; }
      .lx { all: unset; box-sizing: border-box; position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 16px; min-width: 0; cursor: pointer; pointer-events: auto;
        background: var(--card); color: var(--ink-2); -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      .lx::before { content: ''; position: absolute; inset: 0; width: var(--pct); background: #FFE9A8; transition: width .25s ease; }
      .lx > * { position: relative; }
      .lx ha-icon { --mdc-icon-size: 22px; width: 22px; height: 22px; flex: none; color: var(--mute); }
      .lx span { min-width: 0; display: grid; }
      .lx b { font-size: 15px; font-weight: 800; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lx small { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lx.is-on { background: #FFF6D6; }
      .lx.is-on ha-icon { color: var(--ink); }
      .lx.is-on small { color: var(--ink-2); }
      .lx:active { filter: brightness(.95); }
      @media (min-width: 1024px) and (max-width: 1279px) {
      .lx { padding: 0 10px; }
      .lx ha-icon { display: none !important; }
      .lx b { font-size: 14px; font-stretch: 88%; }
      }
