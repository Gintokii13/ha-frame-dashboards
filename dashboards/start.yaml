  frame_rail:
    custom_fields:
      body: |-
        [[[
        const fx = variables.fx; if (!fx) return '';
        const pages = variables.pages.length ? variables.pages : fx.views();
        const cur = variables.active || location.pathname.split('/')[2] || (pages[0] || {}).path;
        const sec = variables.secondary || [];
        const btn = (p, menu) => `<button type="button" class="nav${!menu && sec.includes(p.path) ? ' nav--secondary' : ''}${p.path === cur ? ' is-on' : ''}" onpointerup="__frameGo('${fx.esc(p.path)}');${menu ? "this.closest('details').open=false;" : ''}"><ha-icon icon="${p.icon}"></ha-icon><span>${fx.esc(p.label)}</span></button>`;
        const more = sec.length ? `<details class="rail-more"><summary class="nav${sec.includes(cur) ? ' is-on' : ''}" onpointerup="this.parentElement.open = !this.parentElement.open" onclick="event.preventDefault()"><ha-icon icon="mdi:dots-horizontal"></ha-icon><span>Mehr</span></summary><div class="rail-menu">${pages.filter((p) => sec.includes(p.path)).map((p) => btn(p, true)).join('')}</div></details>` : '';
        const ipad = /iPad/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
