          return `<button type="button" class="st${warn ? ' is-warn' : ''}${live ? '' : ' is-na'}" data-id="${fx.esc(it.entity)}" onpointerup="__frameInfo(this)"><div class="num">${n ? n.v : live ? fx.esc(fx.fmt(it.entity)) : '–'}${n && n.unit ? `<small>${fx.esc(n.unit)}</small>` : ''}</div><div class="label">${fx.esc(it.label)}</div></button>`;
        }).join('');
