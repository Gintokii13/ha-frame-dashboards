      .en-ld.is-rest { cursor: default; }
      .en-ld.is-rest .en-ln, .en-ld.is-rest b { color: var(--mute); font-weight: 600; }
      .en-ld.is-rest .en-lb > i { background: var(--line); }
      .en-quiet { font-family: var(--serif); font-size: 24px; color: var(--mute); }
      .en-ww { all: unset; box-sizing: border-box; margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--paper); cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
      .en-ww ha-icon { --mdc-icon-size: 22px; width: 22px; height: 22px; }
      .en-ww span { flex: 1; font-size: 15px; font-weight: 700; }
      .en-ww b { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
      .en-ww.is-on { background: var(--ink); color: var(--card); }
      .en-ww.is-on b { color: #FFE9A8; }
      @media (max-width: 767px) {
      .en-now { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .en-v { font-size: 38px; }
      }
      @media (min-width: 768px) and (max-width: 1199px) {
      .en-v { font-size: 40px; }
      .en-b { padding: 14px 16px; }
      }
      .en-hero { flex-wrap: wrap; row-gap: 8px; }
      .en-ww span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .en-ww b { white-space: nowrap; }
      @media (max-width: 767px) {
      .en-now { gap: 10px; }
      .en-b { padding: 14px 14px; border-radius: 16px; }
      .en-v { font-size: 40px; }
      .en-s { font-size: 13px; }
      .en-today, .en-loads { height: auto; }
      }
      .en-lh .en-l { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .en-lh .num { flex: none; }
      .en-dev { box-sizing: border-box; background: var(--card); border-radius: 18px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px 32px; }
      .en-dev > .en-quiet { grid-column: 1 / -1; }
      .en-dev-l, .en-dev-r { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .en-dh { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
      .en-dh > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .en-dh .en-l { display: flex; align-items: center; gap: 10px; }
      .en-un { text-align: right; align-items: flex-end; }
      .en-un .num { color: #B9581A; }
      .en-day { all: unset; box-sizing: border-box; height: 22px; padding: 0 9px; border-radius: 11px; background: var(--paper); color: var(--ink-2); font: 700 11px var(--sans); letter-spacing: .04em; text-transform: none; cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
      .en-day:active { background: var(--ink); color: var(--card); }
      .en-chart { height: 168px; pointer-events: auto; }
      .en-chart .bars { position: absolute; inset: 0 0 18px 0; display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; }
      .en-col { display: flex; flex-direction: column-reverse; height: 100%; min-width: 0; }
      .en-col i { display: block; width: 100%; flex: none; }
      .en-col .m { background: var(--ink-2); border-radius: 0 0 2px 2px; }
      .en-col .u { background: var(--warm-2); border-radius: 3px 3px 0 0; }
      .en-col.is-now i { opacity: .55; }
      .en-col.is-fut .f { height: 3px; background: var(--paper-2); border-radius: 2px; }
      .en-col.is-sel i { filter: brightness(.82); }
      .en-ax { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; display: grid; grid-template-columns: repeat(4, 1fr); font-size: 11px; font-weight: 700; color: var(--mute); font-variant-numeric: tabular-nums; }
      .en-leg { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
      .en-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
      .en-leg i.m { background: var(--ink-2); }
      .en-leg i.u { background: var(--warm-2); }
      .en-note { font-family: var(--serif); font-size: 20px; line-height: 1.15; color: var(--ink-2); }
      .en-dv { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 4px; column-gap: 10px; row-gap: 5px; align-items: center; cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
      .en-dv b { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .en-dv .en-lb { grid-column: 1 / 3; }
      .en-dv.is-un { cursor: default; background: var(--warm); margin: 0 -10px; padding: 8px 10px; border-radius: 10px; }
      .en-dv.is-un .en-lb { background: rgb(255 255 255 / .6); }
      .en-dv.is-un .en-lb > i { background: var(--warm-2); }
      .en-more { font-size: 13px; font-weight: 700; color: var(--mute); }
      @media (max-width: 1199px) {
      .en-dev { grid-template-columns: minmax(0, 1fr); }
      }
      @media (max-width: 767px) {
      .en-dev { padding: 14px; border-radius: 16px; }
      .en-chart { height: 140px; }
      .en-chart .bars { gap: 2px; }
      }
    template: frame
    variables:
      loads: []
      part: now
  frame_now:
    custom_fields:
      body: |
        [[[
        const fx = variables.fx; if (!fx) return '';
        const esc = fx.esc, now = Date.now();
        const ok = (s) => !!s && !['unavailable', 'unknown'].includes(s.state);
        const RUN = ['starting', 'running', 'ending', 'rinse', 'anti_wrinkle', 'paused', 'user_paused', 'delay_wait'];
        const tap = (id) => ` data-id="${esc(id)}" onpointerup="__frameInfo(this)"`;
        const nm = (s) => String(s.attributes.friendly_name || s.entity_id).replace(/^Kontakt /, '');
        const alerts = [], dev = [], music = [], info = [];
        (variables.contacts || []).forEach((id) => { const s = states[id]; if (s && s.state === 'on') alerts.push({ id, icon: 'mdi:window-open-variant', t: nm(s) + ' offen', s: 'seit ' + fx.dur(now - new Date(s.last_changed)) }); });
        (variables.gates || []).forEach((g) => { const s = states[g.id]; if (s && ['open', 'opening', 'closing'].includes(s.state)) alerts.push({ id: g.id, icon: 'mdi:garage-open-variant', t: g.name + (s.state === 'open' ? ' offen' : s.state === 'opening' ? ' öffnet' : ' schließt'), s: s.state === 'open' ? 'seit ' + fx.dur(now - new Date(s.last_changed)) : 'fährt gerade' }); });
        (variables.appliances || []).forEach((a) => {
          const s = states[a.id]; if (!ok(s)) return;
          const r = states[a.remaining], m = ok(r) && !isNaN(parseFloat(r.state)) ? Math.round(parseFloat(r.state)) : null;
          if (RUN.includes(s.state)) dev.push({ id: a.id, icon: a.icon, t: a.name + (s.state.includes('paused') ? ' pausiert' : ' läuft'), s: m != null && m > 0 ? 'noch ' + m + ' Min. · fertig ca. ' + fx.time(new Date(now + m * 60000)) : 'Programm aktiv', kind: 'run' });
          else if (['finished', 'completed'].includes(s.state)) dev.push({ id: a.id, icon: a.icon, t: a.name + ' ist fertig', s: 'seit ' + fx.dur(now - new Date(s.last_changed)) + ' · ausräumen', kind: 'done' });
          else if (['error', 'fault'].includes(s.state)) alerts.push({ id: a.id, icon: a.icon, t: a.name + ': Störung', s: 'bitte nachsehen' });
        });
        (variables.media || []).forEach((m) => {
          const s = states[m.e]; if (!ok(s)) return;
          const a = s.attributes, recent = now - new Date(s.last_changed) < 30 * 60000;
          if (s.state === 'playing' || (s.state === 'paused' && a.media_title && recent)) music.push({ id: m.e, room: m.n, s, a });
        });
        const t0 = new Date(); t0.setHours(0, 0, 0, 0);
        let nextWaste = null;
        (variables.waste || []).forEach((w) => {
          const s = states[w.id], mm = s && String(s.state).match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (!mm) return;
          const days = Math.round((new Date(+mm[3], +mm[2] - 1, +mm[1]) - t0) / 864e5);
          if (days === 0 || days === 1) info.push({ id: w.id, icon: w.icon, t: w.name + (days === 0 ? ' heute' : ' morgen'), s: days === 0 ? 'wird heute abgeholt' : 'heute Abend rausstellen' });
          if (days >= 0 && (!nextWaste || days < nextWaste.days)) nextWaste = { n: w.name, days, d: new Date(+mm[3], +mm[2] - 1, +mm[1]) };
        });
        const b = fx.num(variables.battery, 0);
        if (b && b.raw < 10) info.push({ id: variables.battery, icon: 'mdi:battery-low', t: 'Hausakku ' + b.v + ' %', s: 'niedriger Ladestand' });
        const row = (x, kind) => `<div class="nw is-${kind}"${tap(x.id)}><ha-icon icon="${x.icon}"></ha-icon><span><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span></div>`;
        const mu = (x) => {
          const a = x.a, play = x.s.state === 'playing';
          const title = a.media_title || a.media_channel || a.source || 'Musik';
          const sub = [a.media_artist || a.media_album_name || '', x.room].filter(Boolean).join(' · ');
          const art = a.entity_picture ? `<img class="mu-art" src="${esc(a.entity_picture)}" alt="">` : `<span class="mu-art"><ha-icon icon="mdi:music"></ha-icon></span>`;
          return `<div class="mu${play ? ' is-play' : ''}">${art}<span class="mu-t"${tap(x.id)}><b>${esc(title)}</b><small>${esc(sub)}</small></span>`
            + `<button type="button" onpointerup="__frameCall('media_player','media_play_pause',{entity_id:'${x.id}'})"><ha-icon icon="${play ? 'mdi:pause' : 'mdi:play'}"></ha-icon></button>`
            + `<button type="button" onpointerup="__frameCall('media_player','media_next_track',{entity_id:'${x.id}'})"><ha-icon icon="mdi:skip-next"></ha-icon></button></div>`;
        };
        const H = hass.states, ids = Object.keys(H);
        const st = (id) => states[id];
        const go = (p) => ` onpointerup="__frameGo('${p}')"`;
        // heating: rooms below target, sensors offline
        const clim = ids.filter((id) => id.startsWith('climate.vtherm_')).map(st).filter(ok);
        const rn = (s) => String(s.attributes.friendly_name || s.entity_id).replace(/^(Heizung|Vtherm)\s+/i, '').trim();
        clim.filter((s) => s.attributes.current_temperature == null && s.state !== 'off').forEach((s) => alerts.push({ id: s.entity_id, icon: 'mdi:thermometer-off', t: 'Raumfühler ' + rn(s) + ' offline', s: 'Heizung regelt nur nach Thermostat' }));
        const heating = clim.filter((s) => s.attributes.hvac_action === 'heating');
        const cold = clim.filter((s) => s.state !== 'off' && s.attributes.current_temperature != null && s.attributes.current_temperature < s.attributes.temperature - 0.3)
          .sort((a, b) => (b.attributes.temperature - b.attributes.current_temperature) - (a.attributes.temperature - a.attributes.current_temperature));
        const n1 = (v) => fx.nf(v, 1);
        const lg = [];
        lg.push({ p: 'raeume', icon: heating.length ? 'mdi:radiator' : 'mdi:radiator-off', on: heating.length > 0,
          t: heating.length ? heating.length + (heating.length === 1 ? ' Raum heizt' : ' Räume heizen') : 'Heizung ruht',
          s: cold.length ? rn(cold[0]) + ' ' + n1(cold[0].attributes.current_temperature) + '° → ' + n1(cold[0].attributes.temperature) + '°' + (cold.length > 1 ? ' · +' + (cold.length - 1) : '') : 'alle Räume auf Soll' });
        // lights
        const lights = ids.filter((id) => id.startsWith('light.') && !(H[id].attributes.entity_id)).map(st).filter((s) => s && s.state === 'on');
        lg.push({ p: 'raeume', icon: lights.length ? 'mdi:lightbulb-on' : 'mdi:lightbulb-outline', on: lights.length > 0,
          t: lights.length ? lights.length + ' Licht' + (lights.length === 1 ? '' : 'er') + ' an' : 'Alle Lichter aus',
          s: lights.length ? lights.slice(0, 2).map((s) => s.attributes.friendly_name).join(', ') + (lights.length > 2 ? ' …' : '') : 'innen und außen' });
        // covers
        const cov = ids.filter((id) => id.startsWith('cover.') && /_langsam$/.test(id)).map(st).filter(ok);
        const pos = (s) => (s.attributes.current_position != null ? s.attributes.current_position : s.state === 'closed' ? 0 : 100);
        const cOpen = cov.filter((s) => pos(s) >= 95).length, cShut = cov.filter((s) => pos(s) <= 5).length, cMid = cov.length - cOpen - cShut;
        const moving = cov.some((s) => s.state === 'opening' || s.state === 'closing');
        lg.push({ p: 'rolllaeden', icon: cShut === cov.length ? 'mdi:window-shutter' : 'mdi:window-shutter-open', on: moving,
          t: moving ? 'Rollläden fahren' : cOpen === cov.length ? 'Alle Rollläden offen' : cShut === cov.length ? 'Alle Rollläden zu' : cOpen + ' offen · ' + (cMid ? cMid + ' Spalt' : cShut + ' zu'),
          s: [cMid && cShut ? cShut + ' zu' : '', cov.length + ' gesamt'].filter(Boolean).join(' · ') });
        // house power
        const hp = fx.num('sensor.hausverbrauch', 0), pv = fx.num('sensor.wechselrichter_wirkleistung', 0);
        if (hp) lg.push({ p: 'energie', icon: 'mdi:home-lightning-bolt-outline', on: false, t: hp.v + ' W im Haus', s: pv && pv.raw > 20 ? 'Sonne ' + pv.v + ' W' : 'keine Sonne' });
        // weak batteries
        const bat = ids.filter((id) => id.startsWith('sensor.') && H[id].attributes.device_class === 'battery' && id !== variables.battery && !/iphone|ipad|macbook|watch|batterien_/.test(id))
          .map(st).filter((s) => ok(s) && parseFloat(s.state) < 15);
        if (bat.length) info.push({ id: bat[0].entity_id, icon: 'mdi:battery-alert-variant-outline', t: bat.length + (bat.length === 1 ? ' Batterie' : ' Batterien') + ' schwach', s: bat.slice(0, 2).map((s) => String(s.attributes.friendly_name).replace(/ Batterie$/, '') + ' ' + Math.round(parseFloat(s.state)) + ' %').join(', ') });
        const parts = [];
        alerts.forEach((x) => parts.push(row(x, 'warn')));
        dev.forEach((x) => parts.push(row(x, x.kind)));
        music.forEach((x) => parts.push(mu(x)));
        info.forEach((x) => parts.push(row(x, 'info')));
        const max = variables.max || 5;
        let body = parts.slice(0, max).join('') + (parts.length > max ? `<div class="nw-more">+ ${parts.length - max} weitere</div>` : '');
        if (!parts.length) body = `<div class="nw-quiet"><b>Alles ruhig.</b> <span>Nichts läuft, nichts steht offen.</span></div>`;
        const grid = `<div class="lg">${lg.map((x) => `<div class="lg-i${x.on ? ' is-on' : ''}"${go(x.p)}><ha-icon icon="${x.icon}"></ha-icon><span><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span></div>`).join('')}</div>`;
        const lines = [];
        const nxt = fx.agenda(3).find((e) => (e.all_day ? e.to : e.from) > new Date(now) && !(e.all_day && e.from <= new Date(now)));
        if (nxt) lines.push(`<div class="q-l"><ha-icon icon="mdi:calendar-clock"></ha-icon><span>${esc(fx.dayLabel(nxt.from, new Date(now)))} ${nxt.all_day ? '' : fx.time(nxt.from) + ' · '}<b>${esc(nxt.title)}</b> · ${esc(fx.person(nxt.who).name)}</span></div>`);
        if (nextWaste && nextWaste.days > 1) lines.push(`<div class="q-l"><ha-icon icon="mdi:trash-can-outline"></ha-icon><span>${esc(nextWaste.n)} <b>${fx.weekday(nextWaste.d, 'long')}</b></span></div>`);
        return `<div class="blk nw-box"><div class="label">Jetzt</div>${body}${grid}${lines.join('')}</div>`;
        ]]]
    extra_styles: |-
      .blk { position: relative; background: var(--card); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; height: 100%; box-sizing: border-box; overflow: hidden; }
