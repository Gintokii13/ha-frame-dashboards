# Kartenvorlagen frame, frame_clock, frame_weather, frame_people, frame_next, frame_agenda, frame_scene,
# frame_light, frame_cover, frame_lock, frame_openings, frame_rooms und frame_heading nach
# https://github.com/slcr/ha-frame-starter (Chris Jahn, MIT), angepasst. Alle uebrigen Vorlagen sind neu.
# Dashboard "Start" (Speicher-Dashboard)
button_card_templates:
  frame:
    double_tap_action:
      action: none
    hold_action:
      action: none
    show_icon: false
    show_label: false
    show_name: false
    show_ripple: false
    show_state: false
    styles:
      card:
      - padding: 0
      - background: none
      - box-shadow: none
      - border: none
      - border-radius: 0
      - height: 100%
      - overflow: visible
      custom_fields:
        body:
        - height: 100%
        - width: 100%
        - min-width: 0
        - white-space: normal
        - overflow: hidden
        - text-overflow: clip
        - text-align: left
        - justify-self: stretch
      grid:
      - grid-template-areas: '"body"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      - height: 100%
    tap_action:
      action: none
    variables:
      calendars:
      - entity: calendar.familie
        who: family
      - entity: calendar.person_1
        who: person1
      - entity: calendar.person_2
        who: person2
      - entity: calendar.kind_1
        who: kind1
      - entity: calendar.kind_2
        who: kind2
      - entity: calendar.abfallkalender
        who: muell
      categories:
      - color: '#7A2DFF'
        icon: mdi:star-face
        id: kind1
        ink: '#FFFFFF'
        name: Kind 1
      - color: '#FFB000'
        icon: mdi:baby-face-outline
        id: kind2
        ink: '#111111'
        name: Kind 2
      - color: '#7A756B'
        icon: mdi:trash-can-outline
        id: muell
        ink: '#FFFFFF'
        name: Müll
      cover_travel: {}
      family:
        color: '#00A36C'
        icon: mdi:star
        id: family
        ink: '#FFFFFF'
        name: Gemeinsam
      fx: |-
        [[[
        window.__frameCall = window.__frameCall || ((d, s, data) => window.__frameHass && window.__frameHass.callService(d, s, data));
        return window.frame && window.frame.fx.call(this, states, hass, variables);
        ]]]
      people:
      - color: '#2D5BFF'
        id: person1
        ink: '#FFFFFF'
        name: Person 1
        person: person.person_1
      - color: '#E0457B'
        id: person2
        ink: '#FFFFFF'
        name: Person 2
        person: person.person_2
      text:
        all_closed: Alle zu
        all_closed_big: Alles zu
        all_day: Ganztägig
        all_off: Alle aus
        all_open: Alle offen
        at: ''
        away: Unterwegs
        battery: Akku
        closed: Zu
        closing: schließt
        door: Haustür
        door_open: Tür offen
        enjoy: Genieß die Ruhe.
        feels: Gefühlt
        forecast_na: Keine Stundenvorhersage
        happening: Läuft gerade
        high: Max
        high_24h: Max
        home: Zuhause
        last_opened: Zuletzt geöffnet
        lights_on: '{0} an'
        low: Min
        low_24h: Min
        min: Min.
        min_left: Min. übrig
        n_of_m_closed: '{0} von {1} zu'
        n_of_m_on: '{0} von {1} an'
        n_of_m_open: '{0} von {1} offen'
        n_open: '{0} offen'
        never: Nie
        next_7_days: Nächste 7 Tage
        no_events: Keine Termine
        no_events_sub: in den nächsten 7 Tagen
        nothing_planned: Nichts geplant.
        now: Jetzt
        'off': Aus
        'on': An
        open: Offen
        open_since: Offen seit
        opened_today: Heute geöffnet
        opening: öffnet
        rain_from: Regen ab {0}.
        rain_now: Regen bis {0}.
        stale: Keine neuen Werte
        target: Soll
        today: Heute
        today_all_day: Heute
        tomorrow: Morgen
        trend_3h: 3 Std.
        unavailable: Nicht verfügbar
        unknown: Unbekannt
        until: bis {0}
        until_time: bis
        up_next: Als Nächstes
        wear_coat: Mantel.
        wear_jacket: Jacke.
        wear_sweater: Pulli.
        wear_tshirt: T-Shirt.
        wear_umbrella: Schirm.
        weather_na: Wetter nicht verfügbar
        windows_doors: Fenster & Türen
        windy: Windig.
        yesterday: Gestern
      weather: weather.forecast_home
    extra_styles: |-
      :host([hidden]) { display: none !important; }
      :host { --paper: #F2EEE6; --paper-2: #E8E2D5; --card: #FBF9F4;
      --ink: #111111; --ink-2: #3B3934; --mute: #7A756B; --line: #D6CFC0;
      --alert: #E5261E; --wet: #1F6FEB;
      --warm: #F9E2C6; --warm-2: #F2A85F;
      --run: #104AA1; --run-bg: #E5EEF8; --due: #1E095B; --due-2: #D8CEF7;
      --sans: 'Archivo', system-ui, sans-serif;
      --serif: 'Instrument Serif', Georgia, serif;
      --r: 18px;
      --c: var(--ink); --c-rgb: 17 17 17; --c-ink: #FFFFFF; }
      ha-card { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
      #container { text-align: left; align-items: stretch; }
      #container ha-icon { display: inline-flex; flex: none; margin: 0; }
      .label { display: flex; align-items: center; gap: 6px;
      font-size: 15px; font-weight: 700; font-stretch: 80%;
      letter-spacing: .09em; text-transform: uppercase; color: var(--mute); line-height: 1.2; }
      .av { flex: none; display: inline-grid; place-items: center; border-radius: 50%;
      background: var(--c); color: var(--c-ink);
      font-weight: 900; font-stretch: 70%; line-height: 1; padding-top: .1em; box-sizing: border-box; }
      .av--icon { padding-top: 0; }
      .av--away { background: var(--paper); color: var(--c); box-shadow: inset 0 0 0 3px var(--c); }
      .hero .label { color: inherit; opacity: .8; }
      .hero-foot .label { margin-right: 4px; white-space: nowrap; }
      .st .label { margin-top: 6px; font-size: 13px; }
      .room > :not(.spark) { position: relative; z-index: 1; }
      .room-top .label { font-size: 13px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .room.is-stale .spark-l { stroke-dasharray: 3 4; }
      .room.is-heat .spark-a { fill: rgb(242 168 95 / .12); }
      .room.is-heat .spark-l { stroke: rgb(242 168 95 / .7); }
      .spark { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 58%; pointer-events: none; }
      .spark.ch-plot { z-index: 2; }
      .spark-a { fill: rgb(17 17 17 / .045); }
      .spark-l { fill: none; stroke: rgb(17 17 17 / .16); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
      .spark-l2 { fill: none; stroke: rgb(31 111 235 / .38); stroke-width: 1.25; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
      .tap, .ch-plot[data-tips] { pointer-events: auto; }
      .more { position: absolute; inset: 0; z-index: 3; background: var(--ink); color: var(--card); border-radius: var(--r); padding: 13px 16px;
      display: flex; flex-direction: column; justify-content: center; gap: 4px; opacity: 0; pointer-events: none; transition: opacity .18s; overflow: hidden; text-align: left; }
      .tap.is-open > .more { opacity: 1; pointer-events: auto; }
      .more .label { color: rgb(251 249 244 / .55); margin-bottom: 2px; }
      .blk > .more { padding: 10px 18px; gap: 2px; }
      .room > .more { position: absolute; z-index: 3; border-radius: 14px; padding: 10px 12px; gap: 2px; }
      .room .more .kv { font-size: 13px; }
      .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; line-height: 1.25; min-width: 0; }
      .kv span { color: rgb(251 249 244 / .65); white-space: nowrap; }
      .kv b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
      .kv-note { margin-top: auto; font-size: 12px; line-height: 1.25; color: rgb(251 249 244 / .5); }
      .ch-plot:not(.spark) { position: relative; }
      .ch-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .ch-plot[data-tips] { cursor: crosshair; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      .ch-tip { display: none; position: absolute; top: 0; z-index: 2; background: var(--ink); color: var(--card); border-radius: 10px;
      padding: 6px 10px; font-size: 15px; line-height: 1.2; white-space: nowrap; pointer-events: none; box-shadow: 0 4px 14px rgb(17 17 17 / .18); }
      .ch-tip b { font-weight: 800; }
      .ch-mark, .ch-dot { display: none; position: absolute; pointer-events: none; }
      .ch-mark { top: 0; bottom: 0; border-left: 1.5px dashed rgb(17 17 17 / .45); }
      .ch-dot { width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--card); }
      .ch-plot.is-tip .ch-tip, .ch-plot.is-tip.has-dot .ch-mark, .ch-plot.is-tip.has-dot .ch-dot { display: block; }
  frame_agenda:
    custom_fields:
      body: |
        [[[
          const fx = variables.fx;
          if (!fx) return '';
          const now = new Date(), all = fx.agenda(7);
          const blocks = [];
          let rows = 0;
          for (let i = 0; i < 7 && rows < variables.max; i++) {
            const d0 = fx.day0(now, i), d1 = fx.day0(now, i + 1);
            // multi-day events only on the first visible day, with "until ..."
            const allDay = all.filter((e) => e.all_day && e.from < d1 && e.to > d0 && (i === 0 || e.from >= d0));
            const timed = all.filter((e) => !e.all_day && e.from >= d0 && e.from < d1 && e.to > now);
            const items = allDay.concat(timed).slice(0, variables.max - rows);
            if (!items.length) continue;
            rows += items.length;
            const list = items.map((e) => {
              const p = fx.person(e.who), cur = !e.all_day && e.from <= now;
              const until = e.all_day && e.to > d1 ? `<small>${fx.t('until', `${fx.weekday(fx.day0(e.to, -1), 'short')} ${fx.dateShort(fx.day0(e.to, -1))}`)}</small>` : '';
              return `<div class="wk-ev${cur ? ' is-now' : ''}">
                <span class="ev-t">${e.all_day ? fx.t('all_day') : cur ? fx.t('now') : fx.time(e.from)}</span>
                ${fx.avatar(p, 22)}
                <span class="wk-t">${fx.esc(e.title)}${e.loc ? `<small>${fx.esc(e.loc.split('\n')[0])}</small>` : ''}${until}</span>
              </div>`;
            }).join('');
            blocks.push(`<div class="wk-day"><div class="wk-head"><b>${fx.dayLabel(d0, now)}</b><span>${fx.dateLong(d0)}</span></div>${list}</div>`);
          }
          if (!blocks.length) return `<div class="wk"><div class="free"><i>${fx.t('no_events')}</i> ${fx.t('no_events_sub')}</div></div>`;
          return `<div class="wk">${blocks.join('')}<div class="wk-fade"></div></div>`;
        ]]]
    template: frame
    update_timer: 60s
    variables:
      max: 14
    extra_styles: |-
      .free { font-family: var(--serif); font-size: 22px; color: var(--mute); padding: 6px 2px; line-height: 1.1; }
      .free i { font-style: italic; }
      .who { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 0 10px; border-bottom: 3px solid var(--ink); }
      .wk { height: 100%; display: flex; flex-direction: column; gap: 18px; overflow: hidden; position: relative; }
      .wk-day { display: flex; flex-direction: column; gap: 4px; }
      .wk-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 4px; }
      .wk-head b { font-size: 16px; font-weight: 800; font-stretch: 80%; text-transform: uppercase; letter-spacing: .08em; }
      .wk-head span { font-family: var(--serif); font-size: 21px; color: var(--mute); }
      .wk-ev { display: grid; grid-template-columns: 82px 26px 1fr; align-items: center; column-gap: 12px; min-height: 38px; }
      .wk-ev .ev-t { font-size: 16px; font-weight: 800; font-stretch: 70%; font-variant-numeric: tabular-nums; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
      .wk-t { font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .wk-t small { font-size: 16px; font-weight: 400; color: var(--mute); margin-left: 10px; }
      .wk-ev.is-now .wk-t { font-weight: 800; }
      .wk-ev.is-now .ev-t { color: var(--alert); }
      .wk-fade { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(rgb(242 238 230 / 0), var(--paper)); pointer-events: none; }
      @media (max-width: 767px) {
      .wk { height: auto; }
      .wk-fade { display: none; }
      }
      @media (min-width: 768px) and (max-width: 1199px) {
      .who { flex-direction: row; justify-content: flex-start; gap: 32px; }
      }
      .who { justify-content: center; gap: 10px; }
      .wk { gap: 12px; }
      .wk-ev { min-height: 32px; grid-template-columns: 70px 26px 1fr; }
      .wk-t { font-size: 17px; }
      .wk { gap: 10px; }
      .wk-day { gap: 2px; }
      .wk-head { padding-bottom: 4px; margin-bottom: 2px; border-bottom-width: 1px; }
      .wk-head b { font-size: 13px; }
      .wk-head span { font-size: 17px; }
      .wk-ev { min-height: 28px; grid-template-columns: 52px 22px 1fr; column-gap: 10px; }
      .wk-ev .ev-t { font-size: 14px; }
      .wk-t { font-size: 15px; }
      .wk-t small { font-size: 13px; margin-left: 8px; }
      .wk-ev { grid-template-columns: 70px 22px minmax(0, 1fr); }
      @media (max-width: 767px) {
      .wk { max-height: 330px; overflow: hidden; }
      .wk-fade { display: block; height: 40px; }
      .wk-t small { display: none; }
      }
  frame_clock:
    custom_fields:
      body: |
        [[[
          const fx = variables.fx;
          if (!fx) return '';
          const d = new Date(), c = fx.clock(d);
          return `<div class="clk">
            <div class="clk-time num">${c.hm}${c.ampm ? `<small>${c.ampm}</small>` : ''}</div>
            <div class="clk-date"><b>${fx.weekday(d)}</b>${fx.dateLong(d)}</div>
          </div>`;
        ]]]
    styles:
      custom_fields:
        body:
        - overflow: visible
    template: frame
    update_timer: 10s
    extra_styles: |-
      .num { font-stretch: 62%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
      .clk { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 10px; border-bottom: 3px solid var(--ink); }
      .clk-time { font-size: 168px; line-height: .78; letter-spacing: -.035em; white-space: nowrap; }
      .clk-time small { font-size: 40px; letter-spacing: 0; margin-left: 8px; font-stretch: 80%; }
      .clk-date { font-family: var(--serif); font-size: 28px; margin-top: 18px; white-space: nowrap; }
      .clk-date b { font-family: var(--sans); font-weight: 800; font-stretch: 75%; text-transform: uppercase; letter-spacing: .06em; font-size: 21px; margin-right: 8px; }
      .st .num { font-size: 44px; line-height: .9; white-space: nowrap; }
      .st .num small { font-size: 18px; margin-left: 3px; font-stretch: 80%; }
      .st.is-warn .num { color: var(--alert); }
      @media (max-width: 767px) {
      .clk-time { font-size: 112px; }
      }
      .st.is-na .num { color: var(--mute); }
      .rh-sum .num { font-size: 28px; color: var(--ink); }
      @media (min-width: 768px) and (max-width: 1199px) {
      .clk-time { font-size: 120px; }
      }
      @media (max-width: 767px) {
      .clk-time { font-size: 96px; }
      }
      .clk-time { font-size: 112px; }
      .clk-date { font-size: 24px; margin-top: 12px; }
      .clk-date b { font-size: 18px; }
      .st .num { font-size: 38px; }
      @media (max-width: 767px) {
      .clk-time { font-size: 92px; }
      }
      .clk-time { font-size: 100px; }
      .clk-date { font-size: 22px; margin-top: 8px; }
      @media (max-width: 767px) {
      .clk { height: auto; }
      }
      .clk { height: auto; }
  frame_cover:
    custom_fields:
      body: |
        [[[
          const fx = variables.fx;
          if (!fx) return '';
          window.__frameCoverPos = window.__frameCoverPos || ((ev, el) => {
            if (ev.button > 0) return;
            ev.stopPropagation();
            const ids = el.dataset.covers.split(','), val = el.querySelector('.sh-val'), text0 = val.textContent;
            const call = (svc, data) => window.__frameHass.callService('cover', svc, Object.assign({ entity_id: ids }, data || {}));
            const x0 = ev.clientX;
            let pct = null, dragged = false;
            const hold = setTimeout(() => {
              if (dragged) return;
              pct = 'hold';
              el.dispatchEvent(new CustomEvent('hass-more-info', { detail: { entityId: ids[0] }, bubbles: true, composed: true }));
            }, 550);
            const at = (x) => {
              const r = el.getBoundingClientRect();
              const raw = Math.max(0, Math.min(1, (x - r.left) / r.width)) * 100;
              pct = raw < 8 ? 0 : raw > 92 ? 100 : Math.round(raw / 5) * 5;
              el.style.setProperty('--open', pct + '%');
              el.classList.toggle('is-edge', pct <= 0 || pct >= 100);
              val.textContent = pct >= 100 ? el.dataset.open : pct <= 0 ? el.dataset.closed : pct + ' %';
            };
            const move = (m) => {
              if (!dragged && Math.abs(m.clientX - x0) < 6) return;
              if (!dragged) { dragged = true; clearTimeout(hold); el.classList.add('is-drag'); }
              if (m.cancelable) m.preventDefault();
              at(m.clientX);
            };
            const up = (u) => {
              clearTimeout(hold);
              window.removeEventListener('pointermove', move);
              window.removeEventListener('pointerup', up);
              window.removeEventListener('pointercancel', up);
              el.classList.remove('is-drag');
              if (pct === 'hold') return;
              if (u.type === 'pointercancel') { val.textContent = text0; return; }
              if (!dragged && el.classList.contains('is-moving')) { call('stop_cover'); return; }
              if (!dragged) at(u.clientX);
              call('set_cover_position', { position: pct }).catch(() => { val.textContent = text0; });
            };
            window.addEventListener('pointermove', move, { passive: false });
            window.addEventListener('pointerup', up);
            window.addEventListener('pointercancel', up);
          });
          const list = variables.covers.length ? variables.covers : entity ? [entity.entity_id] : [];
          const ok = list.map((id) => states[id]).filter((s) => s && !['unavailable', 'unknown'].includes(s.state));
          const cp = ok.map((s) => fx.coverPos(s)), pos = cp.map((c) => c.pos);
          const avg = pos.length ? Math.round(pos.reduce((a, b) => a + b, 0) / pos.length) : null;
          const up = cp.some((c) => c.moving === 'opening'), down = cp.some((c) => c.moving === 'closing');
          const lo = pos.length ? Math.min(...pos) : null, hi = pos.length ? Math.max(...pos) : null;
          const text = avg == null ? fx.t('unavailable') : up ? `${fx.t('opening')} · ${avg} %` : down ? `${fx.t('closing')} · ${avg} %`
            : avg >= 98 ? fx.t('open') : avg <= 2 ? fx.t('closed') : hi - lo > 10 ? `${lo}–${hi} %` : `${avg} %`;
          // estimated travel: redraw every 0.5 s until the cover reports its real position
          if (cp.some((c) => c.est)) {
            const card = this;
            clearTimeout(card.__shTick);
            card.__shTick = setTimeout(() => { if (card.isConnected && card.requestUpdate) card.requestUpdate('_config'); }, 500);
          }
          const edge = avg == null || avg <= 0 || avg >= 100;
          return `<div class="shb is-${variables.branch}"><div class="sh${!ok.length ? ' is-na' : ''}${edge ? ' is-edge' : ''}${up || down ? ' is-moving' : ''}" style="--open:${avg == null ? 0 : avg}%"
            ${ok.length ? `data-covers="${ok.map((s) => s.entity_id).join(',')}" data-open="${fx.t('open')}" data-closed="${fx.t('closed')}" onpointerdown="__frameCoverPos(event,this)"` : ''}>
            <i class="sh-fill"></i><ha-icon icon="${up || down ? 'mdi:stop' : 'mdi:window-shutter'}"></ha-icon>
            <b>${fx.esc(variables.name)}</b><span class="sh-val">${text}</span></div></div>`;
        ]]]
    styles:
      custom_fields:
        body:
        - overflow: visible
    template: frame
    variables:
      branch: none
      covers: []
      name: Blind
    extra_styles: |-
      .lt.is-na { opacity: .45; }
      .shb { position: relative; height: 100%; box-sizing: border-box; }
      .shb:not(.is-none) { padding-left: 26px; }
      .shb::before, .shb::after { content: ''; position: absolute; border-color: var(--line); border-style: solid; border-width: 0; }
      .shb.is-only::before, .shb.is-first::before { left: 0; width: 26px; top: calc(50% - 1px); border-top-width: 2px; }
      .shb.is-first::after { left: 11px; top: 50%; bottom: -8px; border-left-width: 2px; }
      .shb.is-mid::before, .shb.is-last::before { left: 11px; top: 0; width: 15px; height: calc(50% + 1px);
      border-left-width: 2px; border-bottom-width: 2px; border-bottom-left-radius: 12px; }
      .shb.is-mid::after { left: 11px; top: 0; bottom: -8px; border-left-width: 2px; }
      .sh { position: relative; overflow: hidden; height: 100%; min-height: 48px; box-sizing: border-box; background: var(--card); border-radius: 16px;
      padding: 0 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 10px;
      pointer-events: auto; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; -webkit-tap-highlight-color: transparent; }
      .sh > :not(.sh-fill) { position: relative; z-index: 1; }
      .sh-fill { position: absolute; inset: 0 auto 0 0; width: var(--open); background: #DCE8FB; transition: width .4s ease; }
      .sh.is-drag .sh-fill { transition: none; }
