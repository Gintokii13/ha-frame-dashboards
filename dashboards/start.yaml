  frame_light:
    custom_fields:
      body: |
        [[[
          const fx = variables.fx;
          if (!fx) return '';
          window.__frameLight = window.__frameLight || ((ev, el) => {
            if (ev.button > 0) return;
            const ids = el.dataset.entity.split(','), dim = el.classList.contains('can-dim');
            const x0 = ev.clientX, y0 = ev.clientY, label = el.querySelector('.lt-sub'), text0 = label.textContent;
            const pct0 = el.style.getPropertyValue('--pct');
            let mode = null, pct = null;
            const call = (svc, data) => window.__frameHass.callService('light', svc, data || {}, { entity_id: ids });
            const hold = setTimeout(() => {
              if (mode) return;
              mode = 'hold';
              el.dispatchEvent(new CustomEvent('hass-more-info', { detail: { entityId: ids[0] }, bubbles: true, composed: true }));
            }, 550);
            const move = (m) => {
              const dx = m.clientX - x0, dy = m.clientY - y0;
              if (!mode && dim && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { mode = 'dim'; clearTimeout(hold); el.classList.add('is-dimming'); }
              if (!mode && Math.hypot(dx, dy) > 12) { mode = 'cancel'; clearTimeout(hold); }
              if (mode !== 'dim') return;
              if (m.cancelable) m.preventDefault();
              const r = el.getBoundingClientRect();
              pct = Math.round(Math.max(0, Math.min(1, (m.clientX - r.left) / r.width)) * 100);
              el.style.setProperty('--pct', pct + '%');
              el.classList.toggle('is-edge', pct <= 0 || pct >= 100);
              label.textContent = pct ? pct + ' %' : el.dataset.off;
            };
            const up = (u) => {
              clearTimeout(hold);
              window.removeEventListener('pointermove', move);
              window.removeEventListener('pointerup', up);
              window.removeEventListener('pointercancel', up);
              el.classList.remove('is-dimming');
              // vertical swipe: the browser scrolls and cancels -> do nothing
              if (u.type === 'pointercancel') { el.style.setProperty('--pct', pct0); label.textContent = text0; return; }
              if (mode === 'dim' && pct != null) {
                (pct < 2 ? call('turn_off') : call('turn_on', { brightness_pct: pct })).catch(() => { label.textContent = text0; });
              } else if (!mode) {
                // explicit on/off from what the tile shows (toggle would follow the group state)
                const wasOn = el.classList.contains('is-on');
                el.classList.toggle('is-on');
                call(wasOn ? 'turn_off' : 'turn_on');
              }
            };
            window.addEventListener('pointermove', move, { passive: false });
            window.addEventListener('pointerup', up);
            window.addEventListener('pointercancel', up);
          });
          const ids = variables.area ? fx.areaLights(variables.area) : entity ? [entity.entity_id] : [];
          const l = ids.length ? fx.lit(variables.area ? ids : ids[0]) : null;
          const on = !!(l && l.on), na = !l;
          const modes = [].concat(...ids.map((id) => (states[id] && states[id].attributes.supported_color_modes) || []));
          const dim = !na && modes.some((m) => m !== 'onoff');
          const pct = l ? l.pct : 0;
          const sub = na ? fx.t('unavailable') : on ? (l.dim ? `${pct} %` : fx.t('on')) : fx.t('off');
          // group: the members' colours; area: all its lights
          const members = !variables.area && ids.length && states[ids[0]] && Array.isArray(states[ids[0]].attributes.entity_id)
            ? states[ids[0]].attributes.entity_id : ids;
          const root = this.shadowRoot, g = fx.glowStyle(members.map((id) => states[id]), root && root.querySelector('.lt'));
          if (g.attr) { Promise.resolve().then(() => window.__frameGlowFlush(root)); requestAnimationFrame(() => window.__frameGlowFlush(root)); }
          return `<div class="lt${on ? ' is-on' : ''}${na ? ' is-na' : ''}${dim ? ' can-dim' : ''}${pct <= 0 || pct >= 100 ? ' is-edge' : ''}" style="--pct:${pct}%;${g.style}"${g.attr}
            ${na ? '' : `data-entity="${ids.join(',')}" data-off="${fx.t('off')}" onpointerdown="__frameLight(event,this)"`}>
            <i class="lt-fill"></i><span class="lt-ico"><ha-icon icon="${variables.icon}"></ha-icon></span><b>${fx.esc(variables.name)}</b><span class="lt-sub">${sub}</span>${na ? '' : `<button type="button" class="lt-info" data-id="${ids[0]}" aria-label="Details" onpointerdown="event.stopPropagation()" onpointerup="event.stopPropagation();__frameInfo(this)">i</button>`}</div>`;
        ]]]
    template: frame
