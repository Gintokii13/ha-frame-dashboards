  frame_weather:
    custom_fields:
      body: |
        [[[
          const fx = variables.fx;
          if (!fx) return '';
          const id = entity ? entity.entity_id : variables.weather;
          const cur = states[id];
          if (!cur) return `<div class="wx"><div class="free"><i>${fx.t('weather_na')}</i> · ${fx.esc(id)}</div></div>`;
          const ICON = { 'clear-night': 'mdi:weather-night', cloudy: 'mdi:weather-cloudy', exceptional: 'mdi:alert-circle-outline',
            fog: 'mdi:weather-fog', hail: 'mdi:weather-hail', lightning: 'mdi:weather-lightning', 'lightning-rainy': 'mdi:weather-lightning-rainy',
            partlycloudy: 'mdi:weather-partly-cloudy', pouring: 'mdi:weather-pouring', rainy: 'mdi:weather-rainy', snowy: 'mdi:weather-snowy',
            'snowy-rainy': 'mdi:weather-snowy-rainy', sunny: 'mdi:weather-sunny', windy: 'mdi:weather-windy', 'windy-variant': 'mdi:weather-windy-variant' };
          // worse weather wins when two hours share a slot
          const RANK = ['clear-night', 'sunny', 'partlycloudy', 'cloudy', 'fog', 'windy', 'windy-variant', 'rainy', 'snowy-rainy', 'snowy',
            'hail', 'pouring', 'lightning', 'lightning-rainy', 'exceptional'];
          const night = states['sun.sun'] && states['sun.sun'].state === 'below_horizon';
          const icon = (c, isNight) => (c === 'partlycloudy' && isNight ? 'mdi:weather-night-partly-cloudy' : c === 'sunny' && isNight ? 'mdi:weather-night' : ICON[c] || 'mdi:weather-cloudy');
          const r = (v) => (v == null ? null : Math.round(v));
          const now = Date.now();
          const hours = fx.forecast(id, 'hourly').map((x) => ({ t: new Date(x.datetime), temp: x.temperature, cond: x.condition,
            pop: x.precipitation_probability || 0, mm: x.precipitation || 0, feel: x.apparent_temperature, wind: x.wind_speed }))
            .filter((x) => x.t.getTime() > now - 3600000);
          const daily = fx.forecast(id, 'daily');
          const wet = (x) => /rain|pour|snow|hail|lightning/.test(x.cond || '') || x.pop >= 50 || x.mm >= 0.3;

          const temp = r(cur.attributes.temperature);
          const next24 = hours.slice(0, 24);
          const hi = daily.length ? r(daily[0].temperature) : next24.length ? r(Math.max(...next24.map((x) => x.temp))) : null;
          const lo = daily.length && daily[0].templow != null ? r(daily[0].templow) : next24.length ? r(Math.min(...next24.map((x) => x.temp))) : null;
          const feel = r(cur.attributes.apparent_temperature != null ? cur.attributes.apparent_temperature : hours.length ? hours[0].feel : null);

          // what to wear: highest temperature of the next 12 hours, rain on top
          const next12 = hours.slice(0, 12);
          let say = '', extra = '';
          if (next12.length) {
            const max = Math.max(...next12.map((x) => x.temp));
            say = fx.t(max < variables.coat_below ? 'wear_coat' : max < variables.jacket_below ? 'wear_jacket' : max < variables.sweater_below ? 'wear_sweater' : 'wear_tshirt');
            const firstWet = next12.find(wet);
            if (firstWet && firstWet === next12[0]) {
              const dry = next12.find((x) => !wet(x));
              extra = dry ? fx.t('rain_now', fx.hourLabel(dry.t)) : fx.t('wear_umbrella');
            } else if (firstWet) extra = fx.t('rain_from', fx.hourLabel(firstWet.t));
          }

          // six slots of two hours; icon and rain over both hours so a shower between slots does not vanish
          const slots = [], pts = [];
          for (let i = 1; i + 1 < hours.length && slots.length < 6; i += 2) {
            const a = hours[i], b = hours[i + 1];
            const cond = RANK.indexOf(b.cond) > RANK.indexOf(a.cond) ? b.cond : a.cond;
            const pop = [a, b].filter(wet).reduce((m, x) => Math.max(m, x.pop || 0), 0);
            const isWet = wet(a) || wet(b);
            const isNight = b.t.getHours() >= 21 || b.t.getHours() < 6;
            pts.push({ temp: b.temp, pop: isWet ? pop : 0 });
            slots.push(`<div class="wx-d${isWet ? ' is-wet' : ''}"><span>${fx.hourLabel(b.t)}</span>
              <ha-icon icon="${icon(cond, isNight)}"></ha-icon><b>${r(b.temp)}°</b>
              <small>${isWet && pop ? `${pop}%` : '&nbsp;'}</small></div>`);
          }
          // temperature line through the slot centres, rain probability as bars behind
          let graph = '';
          if (pts.length >= 2) {
            const W = 6 * 20, H = 30, cx = (k) => (k + 0.5) * 20;
            const ts = pts.map((p) => p.temp), tmin = Math.min(...ts), tmax = Math.max(...ts);
            const span = Math.max(8, tmax - tmin), tlo = (tmax + tmin) / 2 - span / 2;
            const ty = (v) => 3 + (1 - (v - tlo) / span) * (H - 8);
            const bars = pts.map((p, k) => (p.pop ? `<rect${p.pop >= 50 ? ' class="is-wet"' : ''} x="${cx(k) - 4}" y="${(H * (1 - p.pop / 100)).toFixed(1)}" width="8" height="${(H * p.pop / 100).toFixed(1)}" rx="1"/>` : '')).join('');
            const f2 = (v) => v.toFixed(2);
            const P = [[0, ty(pts[0].temp)], ...pts.map((p, k) => [cx(k), ty(p.temp)]), [W, ty(pts[pts.length - 1].temp)]];
            let d = `M${f2(P[0][0])},${f2(P[0][1])}`;
            for (let i = 0; i < P.length - 1; i++) {
              const a = P[i - 1] || P[i], b = P[i], c = P[i + 1], e = P[i + 2] || c;
              d += ` C${f2(b[0] + (c[0] - a[0]) / 6)},${f2(b[1] + (c[1] - a[1]) / 6)} ${f2(c[0] - (e[0] - b[0]) / 6)},${f2(c[1] - (e[1] - b[1]) / 6)} ${f2(c[0])},${f2(c[1])}`;
            }
            graph = `<svg class="wx-graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
              <path class="wx-tarea" d="${d} L${W},${H} L0,${H} Z"/><g class="wx-rain">${bars}</g><path class="wx-tline" d="${d}"/></svg>`;
          }
          return `<div class="wx">
            <div class="wx-top">
              <span class="wx-temp num">${temp != null ? temp + '°' : '–'}</span>
              <span class="wx-meta"><b><ha-icon icon="${icon(cur.state, night)}"></ha-icon>${fx.esc(fx.fmt(id))}</b>
                ${hi != null ? `<span>${fx.t('high')} ${hi}°${lo != null ? ` · ${fx.t('low')} ${lo}°` : ''}</span>` : ''}
                ${feel != null ? `<span>${fx.t('feels')} ${feel}°</span>` : ''}</span>
              <div class="wx-say">${say ? `<i>${say}</i>` : ''}${extra ? `<span>${extra}</span>` : ''}</div>
            </div>
            ${slots.length ? `<div class="wx-days">${graph}${slots.join('')}</div>` : `<div class="label">${fx.t('forecast_na')}</div>`}
          </div>`;
        ]]]
    template: frame
    update_timer: 5min
    variables:
      coat_below: 8
      jacket_below: 15
      sweater_below: 21
    extra_styles: |-
      .num { font-stretch: 62%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
      .free { font-family: var(--serif); font-size: 22px; color: var(--mute); padding: 6px 2px; line-height: 1.1; }
      .free i { font-style: italic; }
      .wx { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 0 10px; border-bottom: 3px solid var(--ink); }
      .wx-top { flex: 1; min-height: 0; display: flex; align-items: center; gap: 16px; margin-bottom: 12px; padding: 0 calc(100% / 12 - 21px); }
      .wx-temp { font-size: 108px; line-height: .8; letter-spacing: -.03em; }
      .wx-meta { flex: none; white-space: nowrap; display: flex; flex-direction: column; gap: 2px; font-size: 18px; margin-left: 4px; }
      .wx-meta b { display: flex; align-items: center; gap: 6px; font-weight: 800; font-stretch: 80%; text-transform: uppercase; letter-spacing: .06em; font-size: 16px; }
      .wx-meta ha-icon { --mdc-icon-size: 22px; width: 22px; height: 22px; }
      .wx-meta span { color: var(--mute); font-variant-numeric: tabular-nums; }
      .wx-meta span + span { font-size: 15px; }
      .wx-say { flex: 1; min-width: 0; text-align: right; font-family: var(--serif); font-size: 30px; line-height: 1.08; }
      .wx-say i, .wx-say span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; padding-left: 6px; }
      .wx-say i { font-style: italic; padding-right: .08em; }
      .wx-days { display: grid; grid-template-columns: repeat(6, 1fr); position: relative; }
      .wx-d { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 16px; }
      .wx-graph { position: absolute; inset: 0; width: 100%; height: calc(100% + 10px); z-index: 0; overflow: visible; pointer-events: none;
      -webkit-mask-image: linear-gradient(to right, #000 88%, transparent); mask-image: linear-gradient(to right, #000 88%, transparent); }
      .wx-rain rect { fill: rgb(31 111 235 / .12); }
      .wx-rain rect.is-wet { fill: rgb(31 111 235 / .22); }
      .wx-tarea { fill: rgb(229 38 30 / .06); }
      .wx-tline { fill: none; stroke: rgb(229 38 30 / .4); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
      .wx-d span { font-size: 12px; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
      .wx-d ha-icon { --mdc-icon-size: 22px; width: 22px; height: 22px; }
      .wx-d b { font-weight: 800; font-stretch: 70%; line-height: 1.1; }
      .wx-d small { font-size: 12px; font-weight: 700; line-height: 1.1; color: var(--wet); font-variant-numeric: tabular-nums; }
      .wx-d.is-wet ha-icon { color: var(--wet); }
      .st .num { font-size: 44px; line-height: .9; white-space: nowrap; }
      .st .num small { font-size: 18px; margin-left: 3px; font-stretch: 80%; }
      .st.is-warn .num { color: var(--alert); }
      @media (max-width: 767px) {
      .wx-temp { font-size: 72px; }
      .wx-say { display: none; }
      .wx-top { padding: 0; }
      }
      .st.is-na .num { color: var(--mute); }
      .rh-sum .num { font-size: 28px; color: var(--ink); }
      @media (min-width: 768px) and (max-width: 1199px) {
      .wx-temp { font-size: 80px; }
      .wx-say { display: none; }
      }
      .wx-temp { font-size: 72px; }
      .wx-say { font-size: 22px; }
      .wx-top { padding: 0; gap: 12px; margin-bottom: 8px; }
      .st .num { font-size: 38px; }
      .wx { overflow: hidden; position: relative; isolation: isolate; }
      .wx-days { overflow: hidden; }
      .wx-graph { height: 100%; }
  frame_gate:
    custom_fields:
      body: |-
        [[[
        const fx = variables.fx; if (!fx) return '';
        const s = entity ? entity.state : 'unavailable';
        const T = { closed: 'Zu', open: 'Offen', opening: 'öffnet …', closing: 'schließt …' };
        const na = !T[s];
        const icon = s === 'closed' ? 'mdi:garage-variant' : 'mdi:garage-open-variant';
        const sub = na ? fx.t('unavailable') : T[s] + (s === 'open' ? ' · seit ' + fx.dur(Date.now() - new Date(entity.last_changed)) : '') + (s === 'closed' ? ' · antippen öffnet' : s === 'open' ? ' · antippen schließt' : '');
        return `<div class="sc${!na && s !== 'closed' ? ' is-active' : ''}"${na ? ' style="opacity:.45"' : ''}><ha-icon icon="${icon}"></ha-icon><b>${fx.esc(variables.name)}</b><span>${fx.esc(sub)}</span></div>`;
        ]]]
    hold_action:
      action: more-info
    tap_action:
      action: toggle
      confirmation:
        text: '[[[ return (entity && entity.state === ''closed'' ? ''Wirklich öffnen: '' : ''Wirklich schließen: '') + variables.name + ''?''; ]]]'
    template: frame
    variables:
      name: Tor
    extra_styles: |-
      .sc { height: 100%; box-sizing: border-box; background: var(--card); border-radius: 16px; padding: 12px 14px; display: grid; align-content: center;
      grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; align-items: center; transition: transform .1s; }
      .sc:active { transform: scale(.97); }
      .sc ha-icon { grid-row: 1 / 3; --mdc-icon-size: 26px; width: 26px; height: 26px; color: var(--ink-2); }
      .sc b { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sc span { font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sc.is-active { background: var(--ink); }
      .sc.is-active b, .sc.is-active ha-icon { color: var(--paper); }
      .sc.is-active span { color: rgb(242 238 230 / .7); }
      .sc { padding: 8px 12px; column-gap: 10px; }
      .sc ha-icon { --mdc-icon-size: 22px; width: 22px; height: 22px; }
      .sc b { font-size: 15px; }
      .sc span { font-size: 12px; }
      @media (max-width: 767px) {
      .sc { padding: 8px 10px; column-gap: 8px; }
      .sc b { font-size: 14px; font-stretch: 88%; }
      .sc span { font-size: 11px; }
