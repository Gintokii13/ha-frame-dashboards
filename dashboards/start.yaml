      .lt { position: relative; overflow: hidden; height: 100%; box-sizing: border-box; background-color: var(--card); border-radius: 16px; padding: 7px 14px 7px 10px; display: grid;
      grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; align-content: center; column-gap: 10px; align-items: center; min-width: 0;
      pointer-events: auto; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y;
      -webkit-tap-highlight-color: transparent; }
      .lt > :not(.lt-fill) { position: relative; z-index: 1; }
      .lt-fill { position: absolute; inset: 0; background-color: #FFE9A8; background-image: var(--lt-grad); clip-path: inset(0 100% 0 0); transition: clip-path .25s ease; }
