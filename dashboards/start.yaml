  frame_rooms:
    custom_fields:
      body: |
        [[[
          const fx = variables.fx;
          if (!fx) return '';
          const ids = variables.rooms.flatMap((r) => [r.temp, r.hum]).filter(Boolean);
          const history = fx.hist(ids, variables.hours, 10, 'hour', ['mean', 'min', 'max']);
          const tiles = variables.rooms.map((r) => {
            const t = fx.num(r.temp, 1), h = r.hum ? fx.num(r.hum, 0) : null;
            const rows = (history[r.temp] || []).filter((x) => x.mean != null);
            const lo = rows.reduce((a, b) => (b.min != null && (!a || b.min < a.min) ? b : a), null);
            const hi = rows.reduce((a, b) => (b.max != null && (!a || b.max > a.max) ? b : a), null);
            const ago = rows.length >= 3 ? rows[rows.length - 3] : null;
            const tr = t && ago ? t.raw - ago.mean : null;
            const at = (x) => fx.time(new Date(typeof x.start === 'number' ? x.start : Date.parse(x.start)));
            const tStale = fx.flat(history[r.temp]), hStale = r.hum && fx.flat(history[r.hum]);
            const c = r.climate && states[r.climate];
            const heating = c && c.attributes.hvac_action === 'heating';
            const target = c && c.state !== 'off' && c.attributes.temperature != null ? fx.nf(c.attributes.temperature, 1) + '°' : '';
            const more = fx.more('', [
              [fx.t('low_24h'), lo ? `${fx.nf(lo.min, 1)}° · ${at(lo)}` : null],
              [fx.t('high_24h'), hi ? `${fx.nf(hi.max, 1)}° · ${at(hi)}` : null],
              [fx.t('trend_3h'), tr != null ? `${tr > 0.05 ? '+' : tr < -0.05 ? '−' : '±'}${fx.nf(Math.abs(tr), 1)}°` : null],
              [fx.t('target'), target || null],
              [fx.t('stale'), tStale || hStale ? '⚠︎' : null],
            ]);
            const sub = [h ? `<span class="room-h">${h.v} %</span>` : '', target ? `→ ${target}` : ''].filter(Boolean).join(' · ');
            const key = 'room:' + r.temp;
            return `<div class="room tap${heating ? ' is-heat' : ''}${tStale ? ' is-stale' : ''}${fx.isOpen(key)}"${fx.tapAttr(key)}>${fx.spark(history[r.temp], variables.hours, {
                now: t ? t.raw : null, minSpan: variables.min_span, unit: t ? t.unit : '', decimals: 1,
                line2: r.hum && { rows: history[r.hum], now: h ? h.raw : null, minSpan: variables.hum_min_span, unit: '%' } })}
              <div class="room-top"><span class="label">${fx.esc(r.name)}</span>${heating ? '<ha-icon icon="mdi:fire"></ha-icon>' : ''}</div>
              <div class="room-t num">${t ? t.v : '–'}<small>°</small></div>
              <div class="room-s">${sub || '&nbsp;'}</div>${more}
            </div>`;
          }).join('');
          return `<div class="rooms" style="--cols:${variables.columns}">${tiles}</div>`;
        ]]]
    template: frame
    update_timer: 60s
    variables:
      columns: 2
      hours: 24
      hum_min_span: 10
      min_span: 2
      rooms: []
    extra_styles: |-
      .num { font-stretch: 62%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
      .st .num { font-size: 44px; line-height: .9; white-space: nowrap; }
      .st .num small { font-size: 18px; margin-left: 3px; font-stretch: 80%; }
      .st.is-warn .num { color: var(--alert); }
      .rooms { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); grid-auto-rows: 118px; align-content: start; gap: 10px; }
      .room { position: relative; overflow: hidden; background: var(--card); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .room-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .room-top ha-icon { --mdc-icon-size: 18px; width: 18px; height: 18px; color: var(--warm-2); }
      .room-t { font-size: 42px; line-height: .95; }
      .room-t small { font-size: 18px; margin-left: 2px; }
      .room-s { font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .room-h { color: rgb(31 111 235 / .8); }
      .room.is-stale .room-t { color: var(--mute); }
      .room.is-heat { box-shadow: inset 0 0 0 2px var(--warm-2); }
      .tap { position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
      .st.is-na .num { color: var(--mute); }
      .rh-sum .num { font-size: 28px; color: var(--ink); }
      .rh-sum .is-heat { color: var(--warm-2); font-weight: 800; }
      .st .num { font-size: 38px; }
  frame_scene:
    custom_fields:
      body: |
        [[[
          const fx = variables.fx;
          if (!fx) return '';
          const k = variables.kind;
          const isOn = (id) => { const l = fx.lit(id); return !!(l && l.on); };
          let sub = variables.sub, active = false;
          if (k === 'on' || k === 'off') {
            const n = variables.lights.filter(isOn).length, all = variables.lights.length;
            active = k === 'on' ? all > 0 && n === all : n === 0;
            sub = k === 'on' ? (n === 0 || active ? sub : fx.t('n_of_m_on', n, all)) : (active ? fx.t('all_off') : fx.t('lights_on', n));
          } else if (k === 'open' || k === 'close') {
            const cs = variables.covers.map((id) => states[id]).filter(Boolean);
            const open = cs.filter((s) => s.state !== 'closed' && s.state !== 'unavailable').length;
            const moving = cs.some((s) => s.state === 'opening' || s.state === 'closing');
            active = k === 'open' ? open === cs.length : open === 0;
            sub = moving ? fx.t(cs.some((s) => s.state === 'opening') ? 'opening' : 'closing') + ' …'
              : k === 'open' ? (active ? fx.t('all_open') : fx.t('n_of_m_open', open, cs.length))
              : (active ? fx.t('all_closed') : fx.t('n_of_m_closed', cs.length - open, cs.length));
          } else if (!sub && entity) {
            const ts = entity.entity_id.startsWith('scene.') ? entity.state : entity.attributes.last_triggered;
            const d = ts ? new Date(ts) : null;
            sub = d && !isNaN(d) ? fx.when(d) : fx.t('never');
          }
          return `<div class="sc${active ? ' is-active' : ''}"><ha-icon icon="${variables.icon}"></ha-icon>
            <b>${fx.esc(variables.name)}</b><span>${fx.esc(sub || '')}</span></div>`;
        ]]]
    tap_action:
      action: perform-action
      perform_action: '[[[ return entity && entity.entity_id.startsWith(''scene.'') ? ''scene.turn_on'' : ''script.turn_on''; ]]]'
      target:
        entity_id: '[[[ return entity ? entity.entity_id : ''none''; ]]]'
    template: frame
