          let n = fx.num(it.entity, it.decimals);
          if ((dc === 'timestamp' || dc === 'uptime') && !isNaN(Date.parse(s0.state))) {
            const h = (Date.now() - Date.parse(s0.state)) / 36e5;
            n = h >= 48 ? { raw: h / 24, v: fx.nf(Math.floor(h / 24), 0), unit: 'Tage' } : { raw: h, v: fx.nf(Math.floor(Math.max(h, 0)), 0), unit: 'Std' };
          }
          if (n && (it.scale != null || it.unit != null)) { const raw = n.raw * (it.scale == null ? 1 : it.scale); n = { raw, v: fx.nf(raw, it.decimals), unit: it.unit == null ? n.unit : it.unit }; }
          const s = states[it.entity], live = s && !['unavailable','unknown'].includes(s.state);
