      background-image: linear-gradient(var(--lg-wash), var(--lg-wash)), var(--lt-grad);
      transition: --lg-c0 .9s ease, --lg-t0 .9s ease, --lg-x0 .9s ease, --lg-y0 .9s ease, --lg-w0 .9s ease, --lg-c1 .9s ease, --lg-t1 .9s ease, --lg-x1 .9s ease, --lg-y1 .9s ease, --lg-w1 .9s ease, --lg-c2 .9s ease, --lg-t2 .9s ease, --lg-x2 .9s ease, --lg-y2 .9s ease, --lg-w2 .9s ease, --lg-c3 .9s ease, --lg-t3 .9s ease, --lg-x3 .9s ease, --lg-y3 .9s ease, --lg-w3 .9s ease, --lg-c4 .9s ease, --lg-t4 .9s ease, --lg-x4 .9s ease, --lg-y4 .9s ease, --lg-w4 .9s ease, --lg-c5 .9s ease, --lg-t5 .9s ease, --lg-x5 .9s ease, --lg-y5 .9s ease, --lg-w5 .9s ease, --lg-base .9s ease, --lg-wash .9s ease; }
      .sh.is-na { opacity: .45; cursor: default; }
      .lt.is-edge::after, .sh.is-edge::after { display: none; }
      .st.is-na .num { color: var(--mute); }
      .lt-info { all: unset; position: absolute !important; right: 4px; bottom: 4px; z-index: 4; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font: 700 13px var(--sans); color: var(--ink-2); cursor: pointer; }
