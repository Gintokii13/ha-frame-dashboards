  frame_service:
    template: frame_tile
    tap_action:
      action: none
    variables:
      title: ''
      url: ''
      link: ''
      up: []
      info: []
      charts: []
    custom_fields:
      body: |-
        [[[
        const fx = variables.fx; if (!fx) return '';
        const e = entity, s = e ? e.state : '';
        const UP = variables.up && variables.up.length ? variables.up : ['on','running','online','home','connected'];
        const up = !!e && UP.includes(s);
        const na = !e || s === 'unavailable' || s === 'unknown';
        const name = variables.name || (e ? e.attributes.friendly_name : '');
        const key = (e ? e.entity_id : '') + '|' + name;
        (window.__frameSvcs || (window.__frameSvcs = {}))[key] = { name: variables.title || name, icon: variables.icon || (e && e.attributes.icon), status: e ? e.entity_id : null,
          up: UP, url: variables.url, link: variables.link, info: variables.info, charts: variables.charts, search: variables.search };
        fx.load('frame-popup.js');
        const sub = variables.sub || (e ? (hass.formatEntityState ? hass.formatEntityState(e) : s) : '');
        return `<div class="sc${up ? ' is-active' : ''}" style="position:relative;${na ? 'opacity:.45' : ''}" data-svc="${fx.esc(key)}" onpointerdown="this.__p=[event.clientX,event.clientY,Date.now()]" onpointerup="window.__frameSvc && window.__frameSvc(this.dataset.svc,this,event)"><ha-icon icon="${variables.icon || (e && e.attributes.icon) || 'mdi:server'}"></ha-icon><b>${fx.esc(name)}</b><span>${fx.esc(sub)} · Details</span></div>`;
        ]]]
