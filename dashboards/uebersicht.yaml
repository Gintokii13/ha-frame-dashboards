button_card_templates:
  rollladen_card:
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: more-info
    icon: '[[[ const p = Number(entity.attributes.current_position); if (!Number.isFinite(p)) return ''mdi:window-shutter-alert''; return p <= 10 ? ''mdi:window-shutter'' : ''mdi:window-shutter-open'';
      ]]]'
    styles:
      card:
      - min-height: 168px
      - padding: 14px
      - border-radius: 20px
      - box-shadow: none
      - border: '[[[ return Number.isFinite(Number(entity.attributes.current_position)) ? ''none'' : ''1px dashed var(--divider-color)''; ]]]'
      - background: '[[[ const p = Number(entity.attributes.current_position); const b = Number(states[variables.battery]?.state); if (!Number.isFinite(p)) return ''var(--card-background-color)''; if (Number.isFinite(b)
          && b <= 20) return ''rgba(245,158,11,0.14)''; if (p <= 10) return ''rgba(99,102,241,0.14)''; if (p >= 90) return ''rgba(234,179,8,0.14)''; return ''rgba(14,165,233,0.14)''; ]]]'
      - opacity: '[[[ return Number.isFinite(Number(entity.attributes.current_position)) ? 1 : .5; ]]]'
      - transition: all .25s ease
      grid:
      - grid-template-areas: '"i status" "n n" "place place" "pos pos" "bar bar" "meta meta"'
      - grid-template-columns: 44px 1fr
      - grid-template-rows: 38px min-content min-content min-content 10px 1fr
      icon:
      - width: 28px
      - color: '[[[ const p = Number(entity.attributes.current_position); if (!Number.isFinite(p)) return ''rgb(148,163,184)''; if (p <= 10) return ''rgb(99,102,241)''; if (p >= 90) return ''rgb(234,179,8)'';
          return ''rgb(14,165,233)''; ]]]'
      name:
      - justify-self: start
      - font-size: 16px
      - font-weight: 750
      custom_fields:
        status:
        - justify-self: end
        - align-self: start
        - padding: 4px 8px
        - border-radius: 999px
        - font-size: 11px
        - font-weight: 750
        - background: var(--secondary-background-color)
        place:
        - justify-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
        pos:
        - justify-self: start
        - margin-top: 10px
        - font-size: 30px
        - font-weight: 800
        bar:
        - justify-self: stretch
        - height: 8px
        - border-radius: 999px
        - overflow: hidden
        - background: rgba(127,127,127,.16)
        meta:
        - justify-self: stretch
        - display: flex
        - flex-wrap: wrap
        - gap: 6px
        - margin-top: 10px
        - font-size: 12px
        - color: var(--secondary-text-color)
    custom_fields:
      status: '[[[ const p = Number(entity.attributes.current_position); const b = Number(states[variables.battery]?.state); if (!Number.isFinite(p)) return ''Offline''; if (Number.isFinite(b) && b <= 20)
        return ''Akku''; if (p <= 10) return ''Zu''; if (p >= 90) return ''Offen''; return ''Teilweise''; ]]]'
      place: '[[[ return variables.place ?? ""; ]]]'
      pos: '[[[ const p = Number(entity.attributes.current_position); if (!Number.isFinite(p)) return ''Keine Daten''; return `${Math.round(p)}<span style="font-size:14px;font-weight:650;color:var(--secondary-text-color);margin-left:4px;">%
        offen</span>`; ]]]'
      bar: '[[[ const p = Number(entity.attributes.current_position); const w = Number.isFinite(p) ? Math.max(0, Math.min(100, p)) : 0; let c = ''rgb(14,165,233)''; if (!Number.isFinite(p)) c = ''rgb(148,163,184)'';
        else if (p <= 10) c = ''rgb(99,102,241)''; else if (p >= 90) c = ''rgb(234,179,8)''; return `<div style="width:${w}%;height:100%;border-radius:999px;background:${c};"></div>`; ]]]'
      meta: '[[[ const chip = (icon, text) => `<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:rgba(127,127,127,.10);"><ha-icon icon="${icon}"
        style="width:14px;height:14px;"></ha-icon>${text}</span>`; const parts = []; const b = states[variables.battery]?.state; const l = states[variables.light]?.state; if (variables.dir) parts.push(chip(''mdi:compass-outline'',
        variables.dir)); if (b && ![''unknown'',''unavailable''].includes(b)) parts.push(chip(''mdi:battery'', `${Math.round(Number(b))}%`)); if (l && ![''unknown'',''unavailable''].includes(l)) parts.push(chip(''mdi:white-balance-sunny'',
        `${Math.round(Number(l))} lx`)); return parts.join(''''); ]]]'
