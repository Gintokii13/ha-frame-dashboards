# Dashboard "Übersicht" (Speicher-Dashboard)
views:
- badges:
  - entity: person.person_1
    show_state: true
    type: entity
  - entity: person.person_2
    show_state: true
    type: entity
  - color: cyan
    entity: sensor.aussen_temperature
    name: Außen
    type: entity
  - color: amber
    entity: sensor.wechselrichter_wirkleistung
    name: PV
    type: entity
  - color: pink
    entity: sensor.stromzahler_wirkleistung
    name: Netz
    type: entity
  - type: entity
    entity: sensor.teamspeak_nutzer_online
    name: TS
    color: green
    show_state: true
  header:
    badges_position: top
    card:
      content: |-
        # {{ now().strftime('%H:%M') }}
        ### {% set h = now().hour %}{{ 'Guten Morgen' if 5 <= h < 11 else ('Guten Tag' if 11 <= h < 18 else ('Guten Abend' if 18 <= h < 23 else 'Gute Nacht')) }}, Person 1
        {{ ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][(now().weekday()+1) % 7] }}, {{ now().strftime('%d.%m.%Y') }} · {{ state_attr('weather.forecast_home','temperature') | round(0) }} °C · {{ states('sensor.wechselrichter_wirkleistung') | int(0) }} W PV
      text_only: true
      type: markdown
    layout: responsive
  icon: mdi:home
  max_columns: 4
  path: start
  sections:
  - cards:
    - heading: Schnellzugriff
      icon: mdi:gesture-tap-button
      type: heading
    - type: custom:mushroom-template-card
      primary: Räume
      secondary: '{% set n = states.light | selectattr(''state'',''eq'',''on'') | list | count %}{{ n }} {{ ''Lampe'' if n == 1 else ''Lampen'' }} an'
      icon: mdi:floor-plan
      icon_color: purple
      tap_action:
        action: navigate
        navigation_path: /dashboard-uebersicht/raeume
      grid_options:
        columns: 6
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(139,92,246,0.14); } '
    - type: custom:mushroom-template-card
      primary: Energie
      secondary: '{{ states(''sensor.wechselrichter_wirkleistung'') | int(0) }} W PV · {{ states(''sensor.batterien_batterieladung'') | float(0) | round(0) }} % Akku'
      icon: mdi:lightning-bolt
      icon_color: amber
      tap_action:
        action: navigate
        navigation_path: /dashboard-uebersicht/energie
      grid_options:
        columns: 6
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(250,204,21,0.14); } '
    - type: custom:mushroom-template-card
      primary: Server
      secondary: '{% set n = states(''sensor.teamspeak_nutzer_online'') | int(0) %}{{ n }} auf TeamSpeak · Host {{ states(''sensor.host_cpu_auslastung'') | float(0) | round(0) }} %'
      icon: mdi:server-network
      icon_color: blue
      tap_action:
        action: navigate
        navigation_path: /dashboard-uebersicht/server
      grid_options:
        columns: 6
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(56,189,248,0.14); } '
    - type: custom:mushroom-template-card
      primary: Garten
      secondary: '{% set n = states.valve | selectattr(''state'',''eq'',''open'') | list | count %}{{ ''Alle Ventile zu'' if n == 0 else (n ~ '' Ventil(e) offen'') }}'
      icon: mdi:sprinkler-variant
      icon_color: green
      tap_action:
        action: navigate
        navigation_path: /dashboard-uebersicht/garten
      grid_options:
        columns: 6
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(34,197,94,0.14); } '
    - type: custom:mushroom-template-card
      primary: Sicherheit
      secondary: '{% set n = [states(''binary_sensor.kontakt_haustur_contact''),states(''binary_sensor.kontakt_terrassentur_contact''),states(''binary_sensor.kontakt_fenster_spule_contact''),states(''binary_sensor.kontakt_werkstatt'')]
        | select(''eq'',''on'') | list | count %}{{ ''Alles geschlossen'' if n == 0 else (n ~ '' offen'') }}'
      icon: mdi:shield-home
      icon_color: red
      tap_action:
        action: navigate
        navigation_path: /dashboard-uebersicht/sicherheit
      grid_options:
        columns: 6
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(239,68,68,0.14); } '
    - type: custom:mushroom-template-card
      primary: Heizung
      secondary: '{{ states(''sensor.aussen_temperature'') | float(0) | round(1) | string | replace(''.'', '','') }} °C draußen'
      icon: mdi:radiator
      icon_color: pink
      tap_action:
        action: navigate
        navigation_path: /klima-heizung/anlage
      grid_options:
        columns: 6
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(251,113,133,0.14); } '
    - type: custom:mushroom-template-card
      primary: Kameras
      secondary: '{% set n = [states(''binary_sensor.eingang_motion''),states(''binary_sensor.garten_motion''),states(''binary_sensor.terrasse_motion''),states(''binary_sensor.garage_motion''),states(''binary_sensor.essbereich_motion'')]
        | select(''eq'',''on'') | list | count %}{{ ''Ruhig'' if n == 0 else (n ~ ''× Bewegung'') }}'
      icon: mdi:cctv
      icon_color: blue-grey
      tap_action:
        action: navigate
        navigation_path: /dashboard-kameras
      grid_options:
        columns: 6
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: var(--card-background-color); } '
    - type: custom:mushroom-template-card
      primary: Pflanzen
      secondary: Bodenfeuchte & Gießen
      icon: mdi:flower
      icon_color: teal
      tap_action:
        action: navigate
        navigation_path: /pflanzen-uebersicht
      grid_options:
        columns: 6
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(45,212,191,0.14); } '
    - type: custom:mushroom-template-card
      primary: Rollläden
      secondary: '{% set o = label_entities(''rollladen'') | select(''is_state'',''open'') | list | count %}{{ ''Alle zu'' if o == 0 else (o ~ '' von '' ~ (label_entities(''rollladen'') | count) ~ '' offen'')
        }}'
      icon: '{% set o = label_entities(''rollladen'') | select(''is_state'',''open'') | list | count %}{{ ''mdi:window-shutter'' if o == 0 else ''mdi:window-shutter-open'' }}'
      icon_color: '{% set o = label_entities(''rollladen'') | select(''is_state'',''open'') | list | count %}{{ ''indigo'' if o == 0 else ''amber'' }}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-uebersicht/rolllaeden
      grid_options:
        columns: 6
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(99,102,241,0.14); } '
    column_span: 2
    type: grid
  - cards:
    - heading: Zuhause
      icon: mdi:home-account
      type: heading
    - type: custom:mushroom-template-card
      entity: person.person_1
      primary: Person 1
      secondary: '{% if is_state(''person.person_1'',''home'') %}Zuhause{% elif is_state(''person.person_1'',''not_home'') %}Unterwegs{% else %}{{ states(''person.person_1'') }}{% endif %}'
      picture: '{{ state_attr(''person.person_1'',''entity_picture'') }}'
      icon: mdi:account
      icon_color: '{{ ''blue'' if is_state(''person.person_1'',''home'') else ''grey'' }}'
      tap_action:
        action: more-info
      grid_options:
        columns: 6
      card_mod:
        style: 'ha-card { {% if is_state(''person.person_1'',''home'') %} background: #111111; --primary-text-color: #FBF9F4; --secondary-text-color: rgba(251,249,244,.72); --card-primary-color: #FBF9F4; --card-secondary-color:
          rgba(251,249,244,.72); --tile-color: #FBF9F4;  {% else %}  opacity: .75; {% endif %} }'
    - type: custom:mushroom-template-card
      entity: person.person_2
      primary: Person 2
      secondary: '{% if is_state(''person.person_2'',''home'') %}Zuhause{% elif is_state(''person.person_2'',''not_home'') %}Unterwegs{% else %}{{ states(''person.person_2'') }}{% endif %}'
      picture: '{{ state_attr(''person.person_2'',''entity_picture'') }}'
      icon: mdi:account
      icon_color: '{{ ''blue'' if is_state(''person.person_2'',''home'') else ''grey'' }}'
      tap_action:
        action: more-info
      grid_options:
        columns: 6
      card_mod:
        style: 'ha-card { {% if is_state(''person.person_2'',''home'') %} background: #111111; --primary-text-color: #FBF9F4; --secondary-text-color: rgba(251,249,244,.72); --card-primary-color: #FBF9F4; --card-secondary-color:
          rgba(251,249,244,.72); --tile-color: #FBF9F4;  {% else %}  opacity: .75; {% endif %} }'
    - color: red
      entity: binary_sensor.kontakt_haustur_contact
      grid_options:
        columns: 6
      icon: mdi:door
      name: Haustür
      type: tile
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''binary_sensor.kontakt_haustur_contact'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'']
          %} background: rgba(248,113,113,0.14);  {% else %}  {% endif %} } '
    - color: blue
      entity: binary_sensor.kontakt_briefkasten_contact
      grid_options:
        columns: 6
      icon: mdi:mailbox
      name: Briefkasten
      type: tile
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''binary_sensor.kontakt_briefkasten_contact'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'']
          %} background: rgba(248,113,113,0.14);  {% else %}  {% endif %} } '
    - entity: cover.garagentor
      features:
      - type: cover-open-close
      icon: mdi:garage
      name: Garage
      type: tile
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''cover.garagentor'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'']
          %} background: rgba(45,212,191,0.14);  {% else %}  {% endif %} } '
    - entity: cover.carport_tor
      features:
      - type: cover-open-close
      icon: mdi:garage-variant
      name: Carport
      type: tile
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''cover.carport_tor'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'']
          %} background: rgba(45,212,191,0.14);  {% else %}  {% endif %} } '
    type: grid
  - type: grid
    cards:
    - type: heading
      heading: Haushalt
      icon: mdi:washing-machine
    - type: custom:mushroom-template-card
      entity: sensor.waschmaschine_zustand
      primary: Waschmaschine
      secondary: '{% set z = states(''sensor.waschmaschine_zustand'') %}{% set r = states(''sensor.waschmaschine_verbleibende_zeit'') %}{% set p = states(''sensor.waschmaschine_programm'') %}{% if z in
        [''starting'',''running'',''paused'',''user_paused'',''ending'',''rinse'',''anti_wrinkle'',''delay_wait''] %}Läuft{% if r not in [''unknown'',''unavailable'',''none''] %} · noch {{ r | int(0) }}
        Min{% endif %}{% if p not in [''unknown'',''unavailable'',''none'',''off''] and not p.startswith(''detect'') %} · {{ p }}{% endif %}{% elif z == ''finished'' %}Fertig{% else %}Aus{% endif %}'
      icon: mdi:washing-machine
      icon_color: '{% set z = states(''sensor.waschmaschine_zustand'') %}{{ ''blue'' if z in [''starting'',''running'',''paused'',''user_paused'',''ending'',''rinse'',''anti_wrinkle'',''delay_wait''] else
        (''green'' if z == ''finished'' else ''grey'') }}'
      tap_action:
        action: more-info
      grid_options:
        columns: 12
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(74,144,217,0.14); } '
    - type: custom:mushroom-template-card
      entity: sensor.trockner_zustand
      primary: Trockner
      secondary: '{% set z = states(''sensor.trockner_zustand'') %}{% set r = states(''sensor.trockner_verbleibende_zeit'') %}{% set p = states(''sensor.trockner_programm'') %}{% if z in [''starting'',''running'',''paused'',''user_paused'',''ending'',''rinse'',''anti_wrinkle'',''delay_wait'']
        %}Läuft{% if r not in [''unknown'',''unavailable'',''none''] %} · noch {{ r | int(0) }} Min{% endif %}{% if p not in [''unknown'',''unavailable'',''none'',''off''] and not p.startswith(''detect'')
        %} · {{ p }}{% endif %}{% elif z == ''finished'' %}Fertig{% else %}Aus{% endif %}'
      icon: mdi:tumble-dryer
      icon_color: '{% set z = states(''sensor.trockner_zustand'') %}{{ ''orange'' if z in [''starting'',''running'',''paused'',''user_paused'',''ending'',''rinse'',''anti_wrinkle'',''delay_wait''] else
        (''green'' if z == ''finished'' else ''grey'') }}'
      tap_action:
        action: more-info
      grid_options:
        columns: 12
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(249,115,22,0.14); } '
    - type: custom:mushroom-template-card
      entity: sensor.geschirrspuler_zustand
      primary: Geschirrspüler
      secondary: '{% set z = states(''sensor.geschirrspuler_zustand'') %}{% set r = states(''sensor.geschirrspuler_verbleibende_zeit'') %}{% set p = states(''sensor.geschirrspuler_programm'') %}{% if z
        in [''starting'',''running'',''paused'',''user_paused'',''ending'',''rinse'',''anti_wrinkle'',''delay_wait''] %}Läuft{% if r not in [''unknown'',''unavailable'',''none''] %} · noch {{ r | int(0)
        }} Min{% endif %}{% if p not in [''unknown'',''unavailable'',''none'',''off''] and not p.startswith(''detect'') %} · {{ p }}{% endif %}{% elif z == ''finished'' %}Fertig{% else %}Aus{% endif %}'
      icon: mdi:dishwasher
      icon_color: '{% set z = states(''sensor.geschirrspuler_zustand'') %}{{ ''teal'' if z in [''starting'',''running'',''paused'',''user_paused'',''ending'',''rinse'',''anti_wrinkle'',''delay_wait''] else
        (''green'' if z == ''finished'' else ''grey'') }}'
      tap_action:
        action: more-info
      grid_options:
        columns: 12
        rows: auto
      card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(20,184,166,0.14); } '
  - cards:
    - heading: Energie jetzt
      icon: mdi:solar-power-variant
      tap_action:
        action: navigate
        navigation_path: /dashboard-uebersicht/energie
      type: heading
    - card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(250,204,21,0.14); } '
      entity: sensor.wechselrichter_wirkleistung
      grid_options:
        columns: 6
      icon: mdi:solar-power-variant
      icon_color: amber
      primary: PV-Leistung
      secondary: '{{ states(''sensor.wechselrichter_wirkleistung'') | int(0) }} W'
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(217,70,239,0.14); } '
      entity: sensor.stromzahler_wirkleistung
      grid_options:
        columns: 6
      icon: '{% if states(''sensor.stromzahler_wirkleistung'') | int(0) < 0 %}mdi:transmission-tower-export{% else %}mdi:transmission-tower-import{% endif %}'
      icon_color: '{% if states(''sensor.stromzahler_wirkleistung'') | int(0) < 0 %}green{% else %}pink{% endif %}'
      primary: Netz
      secondary: '{% set p = states(''sensor.stromzahler_wirkleistung'') | int(0) %}{{ p | abs }} W {{ ''Einspeisung'' if p < 0 else ''Bezug'' }}'
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(34,197,94,0.14); } '
      entity: sensor.batterien_batterieladung
      grid_options:
        columns: 6
      icon: mdi:battery-charging-high
      icon_color: green
      primary: Batterie
      secondary: '{{ states(''sensor.batterien_batterieladung'') | float(0) | round(0) }} % · {{ states(''sensor.batterien_lade_entladeleistung'') | int(0) }} W'
      tap_action:
        action: navigate
        navigation_path: /system-gesundheit/batterien
      type: custom:mushroom-template-card
    - card_mod:
        style: 'ha-card { overflow: hidden; background: rgba(56,189,248,0.14); } '
      entity: sensor.wechselrichter_tagesertrag
      grid_options:
        columns: 6
      icon: mdi:chart-box
      icon_color: light-blue
      primary: Ertrag heute
      secondary: '{{ states(''sensor.wechselrichter_tagesertrag'') }} kWh'
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - color_thresholds: []
      entities:
      - entity: sensor.wechselrichter_wirkleistung
        name: PV
        color: '#facc15'
      - entity: sensor.stromzahler_wirkleistung
        name: Netz
        color: '#d946ef'
      grid_options:
        columns: full
        rows: 4
      hours_to_show: 24
      line_width: 3
      name: Verlauf 24 h
      points_per_hour: 2
      show:
        fill: fade
        labels: true
      smoothing: true
      type: custom:mini-graph-card
      card_mod:
        style: 'ha-card { overflow: hidden;  }'
    type: grid
  - cards:
    - badges:
      - icon: mdi:lightbulb-off-outline
        tap_action:
          action: perform-action
          confirmation:
            text: Wirklich alle Lampen ausschalten?
          perform_action: light.turn_off
          target:
            entity_id: all
        type: button
      heading: Licht
      icon: mdi:lightbulb-group
      type: heading
    - entity: light.deckenlampe_wohnzimmer
      features:
      - type: light-brightness
      grid_options:
        columns: 6
      name: Wohnzimmer
      type: tile
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''light.deckenlampe_wohnzimmer'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'']
          %} background: rgba(251,191,36,0.14);  {% else %}  {% endif %} } '
    - entity: light.stehlampe_wohnzimmer
      features:
      - type: light-brightness
      grid_options:
        columns: 6
      name: Stehlampe WZ
      type: tile
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''light.stehlampe_wohnzimmer'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'']
          %} background: rgba(251,191,36,0.14);  {% else %}  {% endif %} } '
    - entity: light.deckenlampe_schlafzimmer
      features:
      - type: light-brightness
      grid_options:
        columns: 6
      name: Schlafzimmer
      type: tile
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''light.deckenlampe_schlafzimmer'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'']
          %} background: rgba(251,191,36,0.14);  {% else %}  {% endif %} } '
    - entity: light.deckenlampe_kinderzimmer
      features:
      - type: light-brightness
      grid_options:
        columns: 6
      name: Kinderzimmer
      type: tile
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''light.deckenlampe_kinderzimmer'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'']
          %} background: rgba(251,191,36,0.14);  {% else %}  {% endif %} } '
    - entity: light.flur_unten
      features:
      - type: light-brightness
      grid_options:
        columns: 6
      name: Flur unten
      type: tile
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''light.flur_unten'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'']
          %} background: rgba(251,191,36,0.14);  {% else %}  {% endif %} } '
    - entity: light.aussenbeleuchtung_eingang
      features:
      - type: light-brightness
      grid_options:
        columns: 6
      name: Außen Eingang
      type: tile
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''light.aussenbeleuchtung_eingang'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'']
          %} background: rgba(251,191,36,0.14);  {% else %}  {% endif %} } '
    type: grid
  - cards:
    - heading: Medien
      icon: mdi:speaker-multiple
      type: heading
    - type: tile
      entity: media_player.wohnzimmer
      name: Wohnzimmer
      state_content:
      - state
      - media_title
      - media_artist
      features:
      - type: media-player-playback
      - type: media-player-volume-slider
      features_position: bottom
      grid_options:
        columns: 12
      card_mod:
        style: 'ha-card { overflow: hidden; {% set s = states(''media_player.wohnzimmer'') %}{% if s in [''unavailable'',''unknown''] %} opacity: .45; {% elif s not in [''off'',''closed'',''idle'',''standby'',''not_home'',''stopped'',''locked'',''disarmed'',''paused'']
          %} background: rgba(167,139,250,0.14);  {% else %}  {% endif %} } '
    - type: tile
      entity: media_player.kuche_2
      name: Küche
      state_content:
      - state
      - media_title
      - media_artist
      features:
      - type: media-player-playback
      - type: media-player-volume-slider
      features_position: bottom
      grid_options:
