# Frame – paper & ink (aus slcr/ha-frame-starter, MIT).
# "Frame" ist für die Frame-Ansichten (pro View gesetzt, randlose Karten ohne Abstand).
# "Frame Haus" ist das Standard-Theme für das ganze Home Assistant (Karten mit feinem Rand, normaler Abstand).
Frame:
  frame-paper: "#F2EEE6"
  frame-paper-2: "#E8E2D5"
  frame-card: "#FBF9F4"
  frame-ink: "#111111"
  frame-ink-2: "#3B3934"
  frame-mute: "#7A756B"
  frame-line: "#D6CFC0"
  primary-font-family: "'Archivo', system-ui, sans-serif"
  ha-font-family-body: "'Archivo', system-ui, sans-serif"
  ha-font-family-heading: "'Instrument Serif', Georgia, serif"
  lovelace-background: "#F2EEE6"
  primary-background-color: "#F2EEE6"
  secondary-background-color: "#E8E2D5"
  card-background-color: "#FBF9F4"
  ha-card-background: "#FBF9F4"
  primary-text-color: "#111111"
  secondary-text-color: "#7A756B"
  disabled-text-color: "#B5AFA3"
  text-primary-color: "#FBF9F4"
  primary-color: "#111111"
  rgb-primary-color: "17, 17, 17"
  dark-primary-color: "#000000"
  light-primary-color: "#3B3934"
  accent-color: "#E5261E"
  rgb-accent-color: "229, 38, 30"
  divider-color: "#D6CFC0"
  outline-color: "#D6CFC0"
  outline-hover-color: "#7A756B"
  state-icon-color: "#3B3934"
  paper-item-icon-color: "#3B3934"
  error-color: "#C0392B"
  warning-color: "#C77D0A"
  success-color: "#3F7D4E"
  info-color: "#3B3934"
  app-header-background-color: "#F2EEE6"
  app-header-text-color: "#111111"
  app-header-border-bottom: "1px solid #D6CFC0"
  sidebar-background-color: "#E8E2D5"
  sidebar-text-color: "#3B3934"
  sidebar-icon-color: "#7A756B"
  sidebar-selected-text-color: "#111111"
  sidebar-selected-icon-color: "#111111"
  sidebar-menu-button-text-color: "#111111"
  sidebar-menu-button-background-color: "#E8E2D5"
  mdc-theme-surface: "#FBF9F4"
  ha-dialog-surface-background: "#FBF9F4"
  dialog-backdrop-filter: "blur(2px)"
  input-fill-color: "#E8E2D5"
  mdc-text-field-fill-color: "#E8E2D5"
  mdc-select-fill-color: "#E8E2D5"
  input-ink-color: "#111111"
  input-label-ink-color: "#7A756B"
  input-idle-line-color: "#D6CFC0"
  input-hover-line-color: "#7A756B"
  switch-checked-color: "#111111"
  switch-checked-button-color: "#FBF9F4"
  switch-checked-track-color: "#111111"
  switch-unchecked-button-color: "#FBF9F4"
  switch-unchecked-track-color: "#D6CFC0"
  slider-color: "#111111"
  slider-track-color: "#D6CFC0"
  data-table-background-color: "#FBF9F4"
  table-row-background-color: "#FBF9F4"
  table-row-alternative-background-color: "#F2EEE6"
  code-editor-background-color: "#F2EEE6"
  markdown-code-background-color: "#E8E2D5"
  scrollbar-thumb-color: "#D6CFC0"
  ha-card-border-radius: "18px"
  ha-card-box-shadow: "none"
  ha-card-border-color: "#D6CFC0"
  ha-badge-border-radius: "999px"
  masonry-view-card-margin: "0px"
  ha-card-border-width: "0"

